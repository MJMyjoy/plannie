<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plannie Business – Pub 3 : Soumettez vos articles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;
    overflow:hidden;gap:16px;
}
canvas{border-radius:16px;box-shadow:0 0 60px rgba(76,175,80,.25);max-width:95vw;max-height:80vh}
@media(max-width:400px){canvas{border-radius:0}}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 28px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:8px}
.btn-play{background:#2E7D32;color:#fff}.btn-play:hover{background:#388E3C}
.btn-dl{background:#fff;color:#2E7D32}.btn-dl:hover{background:#E8F5E9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{color:rgba(255,255,255,.5);font-size:13px;min-height:18px}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<div class="controls">
    <button class="btn btn-play" id="btnPlay" onclick="runAd(false)">▶ Lancer la pub</button>
    <button class="btn btn-dl" id="btnDl" onclick="runAd(true)">📥 Télécharger la vidéo</button>
</div>
<div class="status" id="status"></div>

<script>
// ============================================================
//  Plannie Business — Pub 3 : « Publie, Gagne en Visibilité »
//  Accent : formulaire fonctionnel, pub gratuite mutuelle,
//           Amazon local, commentaires & étoiles
// ============================================================
const W=360, H=640, FPS=30, DURATION=62000;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

// Colors
const G900='#1B5E20', G800='#2E7D32', G700='#388E3C', G600='#43A047', G500='#4CAF50',
      G400='#66BB6A', G300='#81C784', G200='#A5D6A7', G100='#C8E6C9', G50='#E8F5E9';
const GOLD='#F9A825', ORANGE='#EF6C00', BLUE='#1565C0', TEAL='#00897B';
const SITE_URL='plannie-business.onrender.com';
const PHONE='+243 979 508 196';

// ============ IMAGE LOADING ============
const imgFiles={
    logo:      'img/plannie_logo_1792797585289.jpg',
    cover:     'img/plannie_cover_1792799845450.jpg',
    happy:     'img/plannie_happy_result_1792799871450.jpg',
    problem:   'img/plannie_market_problem_1792799857414.jpg',
    chapatte:  'exp/chapatte_500_chez_colodouce.jpg',
    chapatte2: 'exp/chapatte_500_chez_colodouce2.jpg',
    gauffres:  'exp/gauffres_3pcs_a_1000_chez_colodouce.jpg',
    riz:       'exp/Riz+Sauce+Viande_4000_chez_Bondo_Food.jpg',
    tissage:   'exp/tissage_et_closur_40000FC_chez_chriska_business.jpg',
    veste:     'exp/veste_95_dollards_chez_tshoku_business.jpg',
};
const imgs={};
let imgsLoaded=0, imgsTotal=Object.keys(imgFiles).length;
Object.entries(imgFiles).forEach(([k,src])=>{
    const im=new Image();
    im.onload=()=>{imgsLoaded++};
    im.onerror=()=>{imgsLoaded++};
    im.src=src; imgs[k]=im;
});

// ============ HELPERS ============
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeInOut(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function fadeUp(t,delay,dur=500){const p=clamp((t-delay)/dur,0,1);return{a:easeOut(p),y:25*(1-easeOut(p))}}
function fadeIn(t,delay,dur=500){return{a:easeOut(clamp((t-delay)/dur,0,1))}}
function slideL(t,delay,dur=500){const p=clamp((t-delay)/dur,0,1);return{a:easeOut(p),x:-40*(1-easeOut(p))}}
function slideR(t,delay,dur=500){const p=clamp((t-delay)/dur,0,1);return{a:easeOut(p),x:40*(1-easeOut(p))}}
function popScale(t,delay,dur=400){const p=clamp((t-delay)/dur,0,1);const s=p<.7?p/.7*1.15:1.15-(p-.7)/.3*.15;return{a:Math.min(p*2,1),s}}

function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1}
}

function drawLogo(cx,cy,size,alpha=1){
    ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx,cy);
    const s=size/80;ctx.scale(s,s);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath();ctx.moveTo(0,18);ctx.bezierCurveTo(0,-2,14,-22,30,-32);
    ctx.bezierCurveTo(18,-20,10,-4,8,16);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(200,230,201,0.8)';
    ctx.beginPath();ctx.moveTo(0,18);ctx.bezierCurveTo(0,-2,-14,-22,-30,-32);
    ctx.bezierCurveTo(-18,-20,-10,-4,-8,16);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';roundRect(-2,16,4,16,2,'#fff');
    ctx.restore();
}

function drawProgress(t){
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(0,H-4,W,4);
    const grd=ctx.createLinearGradient(0,0,W*(t/DURATION),0);
    grd.addColorStop(0,G400);grd.addColorStop(1,'#fff');
    ctx.fillStyle=grd;ctx.fillRect(0,H-4,W*(t/DURATION),4);
}

function drawBadge(x,y,text,bg,fg='#fff'){
    ctx.font='700 11px "Segoe UI",sans-serif';
    const tw=ctx.measureText(text).width;
    roundRect(x-tw/2-12,y-11,tw+24,24,12,bg);
    ctx.fillStyle=fg;ctx.textAlign='center';
    ctx.fillText(text,x,y+4);
}

function drawParticles(t,count=15,color=G400){
    for(let i=0;i<count;i++){
        const px=(Math.sin(t/800+i*2.1)*0.4+0.5)*W;
        const py=(Math.cos(t/600+i*1.7)*0.4+0.5)*H;
        const sz=2+Math.sin(t/400+i)*2;
        ctx.globalAlpha=0.15+Math.sin(t/500+i)*0.1;
        ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);
        ctx.fillStyle=color;ctx.fill();
    }
    ctx.globalAlpha=1;
}

function drawImgCover(img,x,y,w,h,alpha,zoom=1,panX=0,panY=0){
    if(!img||!img.complete||!img.naturalWidth)return;
    ctx.save();ctx.globalAlpha=alpha;
    ctx.beginPath();roundRect(x,y,w,h,0);ctx.clip();
    const iAR=img.naturalWidth/img.naturalHeight;
    const cAR=w/h;
    let sw,sh;
    if(iAR>cAR){sh=h*zoom;sw=sh*iAR}else{sw=w*zoom;sh=sw/iAR}
    ctx.drawImage(img,x+(w-sw)/2+panX,y+(h-sh)/2+panY,sw,sh);
    ctx.restore();
}

function drawVignette(intensity=0.6){
    const grd=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.9);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(1,`rgba(0,0,0,${intensity})`);
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
}

function wrapText(text,x,y,maxW,lineH){
    const words=text.split(' ');let line='';
    for(const w of words){
        const test=line+w+' ';
        if(ctx.measureText(test).width>maxW&&line!==''){
            ctx.fillText(line.trim(),x,y);y+=lineH;line=w+' ';
        }else{line=test}
    }
    ctx.fillText(line.trim(),x,y);
    return y+lineH;
}

function drawProductCard(img,x,y,w,h,name,price,seller,alpha){
    if(alpha<=0)return;
    ctx.save();ctx.globalAlpha=alpha;
    roundRect(x,y,w,h,14,'rgba(255,255,255,0.95)');
    if(img&&img.complete&&img.naturalWidth){
        ctx.save();
        ctx.beginPath();roundRect(x+6,y+6,w-12,(h*0.55),10);ctx.clip();
        const iAR=img.naturalWidth/img.naturalHeight;
        const cAR=(w-12)/((h*0.55));
        let sw2,sh2;
        if(iAR>cAR){sh2=h*0.55;sw2=sh2*iAR}else{sw2=w-12;sh2=sw2/iAR}
        ctx.drawImage(img,x+6+((w-12)-sw2)/2,y+6+((h*0.55)-sh2)/2,sw2,sh2);
        ctx.restore();
    }
    const ty=y+h*0.55+22;
    ctx.fillStyle='#1A1A1A';ctx.font='700 12px "Segoe UI",sans-serif';ctx.textAlign='left';
    ctx.fillText(name,x+10,ty);
    ctx.fillStyle=G800;ctx.font='800 14px "Segoe UI",sans-serif';
    ctx.fillText(price,x+10,ty+18);
    ctx.fillStyle='#888';ctx.font='400 10px "Segoe UI",sans-serif';
    ctx.fillText('📍 '+seller,x+10,ty+34);
    ctx.restore();
}

function drawStars(x,y,count,size,alpha){
    ctx.save();ctx.globalAlpha=alpha;
    ctx.font=size+'px sans-serif';ctx.textAlign='left';
    let text='';
    for(let i=0;i<5;i++) text+=(i<count)?'⭐':'☆';
    ctx.fillText(text,x,y);
    ctx.restore();
}

// ============================================================
//  SCENES
// ============================================================

// S1: HOOK — « Ton commerce mérite mieux » (0 - 5500)
function drawS1(t){
    // Cover image with slow zoom
    const zoom=1+t/60000;
    drawImgCover(imgs.cover,0,0,W,H,1,zoom,0,-t*0.002);

    const grd=ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,'rgba(0,0,0,0.3)');
    grd.addColorStop(0.5,'rgba(0,0,0,0.15)');
    grd.addColorStop(1,'rgba(0,0,0,0.88)');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    drawVignette(0.35);

    // Logo small top
    const flogo=fadeIn(t,200,400);
    if(flogo.a>0&&imgs.logo.complete){
        ctx.save();ctx.globalAlpha=flogo.a*0.8;
        const sz=40;
        ctx.beginPath();ctx.arc(W/2,40,sz/2,0,Math.PI*2);ctx.clip();
        ctx.drawImage(imgs.logo,W/2-sz/2,40-sz/2,sz,sz);
        ctx.restore();
    }

    const f1=fadeUp(t,500,700);
    ctx.globalAlpha=f1.a;ctx.fillStyle='#fff';
    ctx.font='700 26px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=15;
    ctx.fillText('Tu as des articles',W/2,H*0.38+f1.y);
    ctx.fillText('à vendre ? 🛍️',W/2,H*0.38+38+f1.y);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';

    const f2=fadeUp(t,2200,700);
    ctx.globalAlpha=f2.a;ctx.fillStyle=GOLD;
    ctx.font='800 22px "Segoe UI",sans-serif';
    ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=10;
    ctx.fillText('Publie-les',W/2,H*0.58+f2.y);
    ctx.fillText('GRATUITEMENT',W/2,H*0.58+34+f2.y);
    ctx.fillText('sur Plannie Business ! 🚀',W/2,H*0.58+68+f2.y);
    ctx.shadowBlur=0;ctx.shadowColor='transparent';

    const fa=fadeUp(t,4400,400);
    if(fa.a>0){
        ctx.globalAlpha=fa.a*(0.4+0.6*Math.abs(Math.sin(t/350)));
        ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.textAlign='center';
        ctx.fillText('↓',W/2,H-30);
    }
    ctx.globalAlpha=1;
}

// S2: AMAZON LOCAL — « Le Amazon de ta ville » (5500 - 12000)
function drawS2(t){
    const grd=ctx.createLinearGradient(0,0,W,H);
    grd.addColorStop(0,'#0D3B14');grd.addColorStop(1,G900);
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    drawParticles(t,18,G300);

    // Flash
    if(t<300){
        ctx.fillStyle=`rgba(255,255,255,${0.4*(1-t/300)})`;
        ctx.fillRect(0,0,W,H);
    }

    const ft=fadeUp(t,200,500);
    ctx.globalAlpha=ft.a;ctx.fillStyle='#fff';
    ctx.font='700 19px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('🏪 Un Amazon Local',W/2,45+ft.y);
    ctx.fillStyle=G200;ctx.font='italic 13px "Segoe UI",sans-serif';
    ctx.fillText('Des articles proches de ton quotidien',W/2,68+ft.y);
    ctx.globalAlpha=1;

    // 5 product cards — showcasing variety including veste
    const products=[
        {img:imgs.veste,    name:'Veste élégante',     price:'95 $',       seller:'Tshoku Business',    d:600},
        {img:imgs.chapatte2,name:'Chapatte maison',    price:'500 FC',     seller:'Colo Douce',         d:1000},
        {img:imgs.riz,      name:'Riz+Sauce+Viande',   price:'4.000 FC',   seller:'Bondo Food',         d:1500},
        {img:imgs.gauffres, name:'Gauffres (3 pcs)',    price:'1.000 FC',   seller:'Colo Douce',         d:2000},
        {img:imgs.tissage,  name:'Tissage & Closure',   price:'40.000 FC',  seller:'Chriska Business',   d:2500},
    ];

    // First row: 2 cards + veste featured large
    const cardW=150, cardH=185, gap=14, startX=(W-cardW*2-gap)/2;

    // Featured big card (veste) — centered at top
    const fv=fadeUp(t,600,700);
    if(fv.a>0){
        const bigW=200, bigH=240;
        const bx=(W-bigW)/2, by=90+fv.y;
        ctx.save();ctx.globalAlpha=fv.a;
        ctx.shadowColor='rgba(76,175,80,0.3)';ctx.shadowBlur=20;ctx.shadowOffsetY=6;
        roundRect(bx,by,bigW,bigH,16,'rgba(255,255,255,0.97)');
        ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
        if(imgs.veste&&imgs.veste.complete&&imgs.veste.naturalWidth){
            ctx.save();
            ctx.beginPath();roundRect(bx+8,by+8,bigW-16,bigH*0.6,12);ctx.clip();
            const iAR=imgs.veste.naturalWidth/imgs.veste.naturalHeight;
            const cAR=(bigW-16)/(bigH*0.6);
            let sw,sh;
            if(iAR>cAR){sh=bigH*0.6;sw=sh*iAR}else{sw=bigW-16;sh=sw/iAR}
            ctx.drawImage(imgs.veste,bx+8+((bigW-16)-sw)/2,by+8+((bigH*0.6)-sh)/2,sw,sh);
            ctx.restore();
        }
        const ty=by+bigH*0.6+26;
        ctx.fillStyle='#1A1A1A';ctx.font='700 15px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText('Veste élégante',bx+14,ty);
        ctx.fillStyle=G800;ctx.font='800 17px "Segoe UI",sans-serif';
        ctx.fillText('95 $',bx+14,ty+22);
        ctx.fillStyle='#888';ctx.font='400 11px "Segoe UI",sans-serif';
        ctx.fillText('📍 Tshoku Business',bx+14,ty+40);
        // Star rating
        drawStars(bx+bigW-78,ty+38,4,10,fv.a);
        // Badge NEW
        drawBadge(bx+bigW-30,by+20,'NEW',ORANGE);
        ctx.restore();
    }

    // 4 smaller cards — bottom row (2x2)
    products.slice(1).forEach((p,i)=>{
        const sl=fadeUp(t,p.d,600);
        if(sl.a<=0)return;
        const col=i%2, row=Math.floor(i/2);
        const cx=startX+col*(cardW+gap);
        const cy=350+row*(cardH+gap)+sl.y;
        ctx.save();ctx.globalAlpha=sl.a*0.12;
        ctx.shadowColor='rgba(0,0,0,0.12)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
        roundRect(cx,cy,cardW,cardH,14,'#fff');
        ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
        ctx.restore();
        drawProductCard(p.img,cx,cy,cardW,cardH,p.name,p.price,p.seller,sl.a);
    });

    // Bottom message
    const fb=fadeUp(t,4500,500);
    if(fb.a>0){
        ctx.globalAlpha=fb.a;
        ctx.fillStyle=GOLD;ctx.font='700 14px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Nourriture • Mode • Beauté • Tech •  Services...',W/2,H-20+fb.y);
    }
    ctx.globalAlpha=1;
}

// S3: LE FORMULAIRE — « C'est simple, ça marche ! » (12000 - 19000)
function drawS3(t){
    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);

    const ft=fadeUp(t,100,400);
    ctx.globalAlpha=ft.a;ctx.fillStyle='#fff';
    ctx.font='700 20px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('📝 Le formulaire est prêt !',W/2,45+ft.y);
    ctx.fillStyle=G300;ctx.font='400 13px "Segoe UI",sans-serif';
    ctx.fillText('Soumettez vos articles n\'importe quand',W/2,68+ft.y);
    ctx.globalAlpha=1;

    // Simulated form UI
    const formBg=fadeUp(t,400,500);
    if(formBg.a>0){
        ctx.globalAlpha=formBg.a;
        // Phone mockup frame
        roundRect(35,88+formBg.y,W-70,H-145,20,'rgba(255,255,255,0.04)','rgba(255,255,255,0.12)');

        // Status bar
        roundRect(55,100+formBg.y,W-110,24,8,'rgba(76,175,80,0.3)');
        ctx.fillStyle=G400;ctx.font='700 11px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('🌿 plannie-business.onrender.com/soumettre/',W/2,116+formBg.y);
    }

    // Form fields animated
    const fields=[
        {label:'📸 Image de l\'article',placeholder:'[ photo sélectionnée ✅ ]',color:G500,d:800},
        {label:'📦 Nom de l\'article',placeholder:'Veste Safari Grise',color:BLUE,d:1200},
        {label:'💬 Description',placeholder:'Veste élégante style Safari...',color:TEAL,d:1600},
        {label:'💰 Prix à afficher',placeholder:'95 $',color:GOLD,d:2000},
        {label:'📍 Ville',placeholder:'Lubumbashi',color:ORANGE,d:2400},
        {label:'📱 Numéro WhatsApp',placeholder:'+243 97x xxx xxxx',color:G600,d:2800},
        {label:'🚚 Lieu de livraison',placeholder:'Quartier Gambela, av. Lac...',color:'#7B1FA2',d:3200},
    ];

    fields.forEach((f,i)=>{
        const sl=slideL(t,f.d,500);
        if(sl.a<=0)return;
        ctx.globalAlpha=sl.a;
        const fy=135+i*62+formBg.y;
        // Field container
        roundRect(52+sl.x,fy,W-104,50,10,'rgba(255,255,255,0.06)');
        // Label
        ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='500 10px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText(f.label,62+sl.x,fy+15);
        // Input value
        ctx.fillStyle='#fff';ctx.font='500 13px "Segoe UI",sans-serif';
        ctx.fillText(f.placeholder,62+sl.x,fy+35);
        // Color accent bar
        ctx.fillStyle=f.color;ctx.fillRect(52+sl.x,fy+42,W-104,2);
    });

    // Submit button animation
    const fbtn=fadeUp(t,4200,500);
    if(fbtn.a>0){
        ctx.globalAlpha=fbtn.a;
        const pulse=0.7+0.3*Math.sin(t/250);
        const btnY=575+formBg.y+fbtn.y;
        ctx.shadowColor=`rgba(76,175,80,${0.3*pulse})`;ctx.shadowBlur=15;
        roundRect(55,btnY,W-110,44,22,G800);
        ctx.shadowColor='transparent';ctx.shadowBlur=0;
        ctx.fillStyle='#fff';ctx.font='700 15px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('✅ Soumettre mon article',W/2,btnY+28);
    }

    // Success popup
    const fok=fadeUp(t,5400,500);
    if(fok.a>0){
        ctx.globalAlpha=fok.a*0.95;
        // Dim background
        ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
        // Modal
        const ps=popScale(t,5400,500);
        ctx.save();ctx.translate(W/2,H/2);ctx.scale(ps.s||1,ps.s||1);ctx.translate(-W/2,-H/2);
        roundRect(40,H/2-90,W-80,180,20,'rgba(255,255,255,0.98)');
        ctx.fillStyle='#333';ctx.font='40px sans-serif';ctx.textAlign='center';
        ctx.fillText('🎉',W/2,H/2-40);
        ctx.fillStyle='#1A1A1A';ctx.font='700 16px "Segoe UI",sans-serif';
        ctx.fillText('Article soumis !',W/2,H/2);
        ctx.fillStyle='#666';ctx.font='400 12px "Segoe UI",sans-serif';
        ctx.fillText('Votre article sera publié dans',W/2,H/2+25);
        ctx.fillText('moins de 6 heures. 🚀',W/2,H/2+42);
        roundRect(W/2-50,H/2+55,100,34,17,G800);
        ctx.fillStyle='#fff';ctx.font='700 13px "Segoe UI",sans-serif';
        ctx.fillText('Super !',W/2,H/2+77);
        ctx.restore();
    }
    ctx.globalAlpha=1;
}

// S4: PUB GRATUITE MUTUELLE — « Publie = pub gratuite » (19000 - 27000)
function drawS4(t){
    const grd=ctx.createLinearGradient(0,0,W,H);
    grd.addColorStop(0,G900);grd.addColorStop(1,'#0D3B14');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    drawParticles(t,20,G400);

    const ft=fadeUp(t,100,400);

// ============ AUDIO ============
let actx,masterGain,audioDest;
function initAudio(rec){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=actx.createGain();masterGain.gain.value=0.8;
    masterGain.connect(actx.destination);
    if(rec){audioDest=actx.createMediaStreamDestination();masterGain.connect(audioDest)}
}
function playTone(f,dur,type='sine',vol=0.15){
    if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g);g.connect(masterGain);o.start();o.stop(actx.currentTime+dur);
}
function sfxWhoosh(){
    if(!actx)return;const n=actx.sampleRate*0.35,buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)*0.25;
    const s=actx.createBufferSource();s.buffer=buf;
    const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=0.8;
    bp.frequency.exponentialRampToValueAtTime(2200,actx.currentTime+0.3);
    s.connect(bp);bp.connect(masterGain);s.start();
}

    if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';

    o.frequency.exponentialRampToValueAtTime(800,actx.currentTime+0.6);
    g.gain.setValueAtTime(0.08,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.7);
    o.connect(g);g.connect(masterGain);o.start();o.stop(actx.currentTime+0.7);
}

// ============ PLAYBACK & RECORDING ============
let isRunning=false;
function runAd(download){
    if(isRunning)return;
    if(imgsLoaded<imgsTotal){
        document.getElementById('status').textContent='⏳ Chargement des images...';
        setTimeout(()=>runAd(download),500);return;
    }
    isRunning=true;
    const btnP=document.getElementById('btnPlay'),btnD=document.getElementById('btnDl'),st=document.getElementById('status');
    btnP.disabled=true;btnD.disabled=true;
    initAudio(download);
    let recorder,chunks=[];
    if(download){
        st.textContent='⏺ Enregistrement en cours... ~1 minute';
        const vs=cv.captureStream(FPS);
        if(audioDest)audioDest.stream.getAudioTracks().forEach(t=>vs.addTrack(t));
        const mt=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':
                  MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';
        recorder=new MediaRecorder(vs,{mimeType:mt,videoBitsPerSecond:3000000});
        recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
        recorder.onstop=()=>{
            const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);
            const a=document.createElement('a');a.href=url;a.download='Plannie_Business_Pub3.webm';
            document.body.appendChild(a);a.click();a.remove();
            setTimeout(()=>URL.revokeObjectURL(url),5000);
            st.textContent='✅ Vidéo téléchargée ! (Plannie_Business_Pub3.webm)';
        };
        recorder.start();
    }else{st.textContent='▶ Lecture en cours...'}
    startBg();scheduleSounds();
    const t0=performance.now();
    function loop(now){
        const elapsed=now-t0;renderFrame(Math.min(elapsed,DURATION));
        if(elapsed<DURATION+500){requestAnimationFrame(loop)}
        else{
            if(recorder&&recorder.state==='recording')recorder.stop();
            isRunning=false;btnP.disabled=false;btnD.disabled=false;
            if(!download)st.textContent='✅ Lecture terminée';
        }
    }
    requestAnimationFrame(loop);
}
renderFrame(0);
