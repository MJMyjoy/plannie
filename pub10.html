<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plannie Business – Revenez publier !</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;gap:16px}
canvas{border-radius:16px;box-shadow:0 0 60px rgba(76,175,80,.25);max-width:95vw;max-height:80vh}
@media(max-width:400px){canvas{border-radius:0}}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 28px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:8px}
.btn-play{background:#2E7D32;color:#fff}.btn-play:hover{background:#388E3C}
.btn-dl{background:#fff;color:#2E7D32}.btn-dl:hover{background:#E8F5E9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{color:rgba(255,255,255,.5);font-size:13px;min-height:18px}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<div class="controls">
    <button class="btn btn-play" id="btnPlay" onclick="runAd(false)">▶ Lancer la pub</button>
    <button class="btn btn-dl" id="btnDl" onclick="runAd(true)">📥 Télécharger la vidéo</button>
</div>
<div class="status" id="status"></div>

<script>
const W=360,H=640,FPS=30,DURATION=62000;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

const G900='#1B5E20',G800='#2E7D32',G500='#4CAF50',G400='#66BB6A',G300='#81C784',G200='#A5D6A7';
const GOLD='#F9A825',ORANGE='#EF6C00',BLUE='#1565C0',RED='#D32F2F',PURPLE='#7B1FA2';
const WA_GREEN='#25D366',WA_DARK='#075E54',WA_LIGHT='#DCF8C6';
const SITE='plannie-business.onrender.com';
const PHONE='+243 979 508 196';

const imgFiles={
    logo:'img/plannie_logo_1792797585289.jpg',
    cover:'img/plannie_cover_1792799845450.jpg',
    happy:'img/plannie_happy_result_1792799871450.jpg',
};
// Load exp images dynamically
const expFiles=[];
const expDir='exp/';

const imgs={};let imgsLoaded=0,imgsTotal=Object.keys(imgFiles).length+3;
Object.entries(imgFiles).forEach(([k,src])=>{const im=new Image();im.onload=()=>{imgsLoaded++};im.onerror=()=>{imgsLoaded++};im.src=src;imgs[k]=im});

// Load exp images
const expNames=[
    {key:'drap',src:'exp/2 drap + 4 oreillet à 35000fc chez TSHOKU BUSINESS.jpg'},
    {key:'hannah',src:'exp/HANNAH, Une histoire vraie appréciée par tous, 20000FC jusqu\'à la fin de l\'année au lieu de 25000 chez Havila.jpg'},
    {key:'riz',src:'exp/Riz + Spaghetti + Oeufs + saucisse en promotion à 3000 FC aujourd\'hui au lieu de 4000 FC chez BONDO Food.jpg'},
];
expNames.forEach(({key,src})=>{const im=new Image();im.onload=()=>{imgsLoaded++};im.onerror=()=>{imgsLoaded++};im.src=src;imgs[key]=im});

// Helpers
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function easeOut(t){return 1-Math.pow(1-t,3)}
function fadeUp(t,d,dur=500){const p=clamp((t-d)/dur,0,1);return{a:easeOut(p),y:25*(1-easeOut(p))}}
function fadeIn(t,d,dur=500){return{a:easeOut(clamp((t-d)/dur,0,1))}}
function slideL(t,d,dur=500){const p=clamp((t-d)/dur,0,1);return{a:easeOut(p),x:-40*(1-easeOut(p))}}
function slideR(t,d,dur=500){const p=clamp((t-d)/dur,0,1);return{a:easeOut(p),x:40*(1-easeOut(p))}}
function popScale(t,d,dur=400){const p=clamp((t-d)/dur,0,1);const s=p<.7?p/.7*1.15:1.15-(p-.7)/.3*.15;return{a:Math.min(p*2,1),s}}

function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1}
}
function drawBadge(x,y,text,bg,fg='#fff'){
    ctx.font='700 11px "Segoe UI",sans-serif';const tw=ctx.measureText(text).width;
    roundRect(x-tw/2-12,y-11,tw+24,24,12,bg);ctx.fillStyle=fg;ctx.textAlign='center';ctx.fillText(text,x,y+4);
}
function drawParticles(t,n=15,c=G400){
    for(let i=0;i<n;i++){const px=(Math.sin(t/800+i*2.1)*0.4+0.5)*W;const py=(Math.cos(t/600+i*1.7)*0.4+0.5)*H;
    const sz=2+Math.sin(t/400+i)*2;ctx.globalAlpha=0.15+Math.sin(t/500+i)*0.1;ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}ctx.globalAlpha=1;
}
function drawImgCover(img,x,y,w,h,a=1){
    if(!img||!img.complete||!img.naturalWidth)return;ctx.save();ctx.globalAlpha=a;
    ctx.beginPath();roundRect(x,y,w,h,0);ctx.clip();
    const iAR=img.naturalWidth/img.naturalHeight,cAR=w/h;let sw,sh;
    if(iAR>cAR){sh=h;sw=sh*iAR}else{sw=w;sh=sw/iAR}
    ctx.drawImage(img,x+(w-sw)/2,y+(h-sh)/2,sw,sh);ctx.restore();
}
function drawImgCoverRound(img,x,y,w,h,r,a=1){
    if(!img||!img.complete||!img.naturalWidth)return;
    ctx.save();
    try{
        ctx.globalAlpha=a;
        ctx.beginPath();
        ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
        ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
        ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
        ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.clip();
        const iAR=img.naturalWidth/img.naturalHeight,cAR=w/h;let sw,sh;
        if(iAR>cAR){sh=h;sw=sh*iAR}else{sw=w;sh=sw/iAR}
        ctx.drawImage(img,x+(w-sw)/2,y+(h-sh)/2,sw,sh);
    }catch(e){console.error('drawImgCoverRound error:',e);}
    ctx.restore();
}
function wrapText(text,x,y,maxW,lineH){
    const words=text.split(' ');let line='';
    for(const w of words){const test=line+w+' ';if(ctx.measureText(test).width>maxW&&line!==''){ctx.fillText(line.trim(),x,y);y+=lineH;line=w+' '}else{line=test}}
    ctx.fillText(line.trim(),x,y);return y+lineH;
}
function drawProgress(t){
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(0,H-4,W,4);
    const grd=ctx.createLinearGradient(0,0,W*(t/DURATION),0);grd.addColorStop(0,G400);grd.addColorStop(1,'#fff');
    ctx.fillStyle=grd;ctx.fillRect(0,H-4,W*(t/DURATION),4);
}

function drawStars(x,y,count,size=16,filled=5){
    ctx.font=`${size}px sans-serif`;ctx.textAlign='left';
    for(let i=0;i<count;i++){
        ctx.fillStyle=i<filled?'#FFD700':'#444';
        ctx.fillText('⭐',x+i*(size+4),y);
    }
}

function drawWhatsAppIcon(x,y,sz){
    ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fillStyle=WA_GREEN;ctx.fill();
    // Phone icon inside
    ctx.fillStyle='#fff';ctx.font=`${sz}px sans-serif`;ctx.textAlign='center';
    ctx.fillText('📱',x,y+sz*0.35);
}

// ============================================================
// S1: HOOK — Déjà publié ? Revenez ! (0-6000)
// ============================================================
function drawS1(t){
    ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);

    // Subtle gradient particles
    drawParticles(t,12,G300);

    // Flash intro
    if(t<300){ctx.fillStyle=`rgba(76,175,80,${0.4*(1-t/300)})`;ctx.fillRect(0,0,W,H)}

    // Logo
    const fl=fadeUp(t,100,500);
    if(fl.a>0&&imgs.logo&&imgs.logo.complete){
        ctx.save();ctx.globalAlpha=fl.a;const sz=60;
        ctx.beginPath();ctx.arc(W/2,55+fl.y,sz/2,0,Math.PI*2);ctx.clip();
        ctx.drawImage(imgs.logo,W/2-sz/2,55-sz/2+fl.y,sz,sz);ctx.restore();
    }

    // Question line
    const f1=fadeUp(t,600,600);
    ctx.globalAlpha=f1.a;ctx.fillStyle='#fff';
    ctx.font='700 20px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Vous avez déjà publié',W/2,H*0.22+f1.y);
    ctx.fillText('sur Plannie Business ?',W/2,H*0.22+30+f1.y);

    // Big animated "OUI ?"
    const f2=popScale(t,1800,500);
    if(f2.a>0){
        ctx.save();ctx.globalAlpha=f2.a;
        ctx.translate(W/2,H*0.38);ctx.scale(f2.s,f2.s);ctx.translate(-W/2,-H*0.38);
        ctx.fillStyle=GOLD;ctx.font='900 46px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('OUI ?',W/2,H*0.38);
        ctx.restore();
    }

    // Then...
    const f3=fadeUp(t,3000,600);
    ctx.globalAlpha=f3.a;ctx.fillStyle='#fff';
    ctx.font='400 18px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Alors...',W/2,H*0.50+f3.y);

    // REVENEZ PUBLIER ENCORE !
    const f4=popScale(t,3800,600);
    if(f4.a>0){
        ctx.save();ctx.globalAlpha=f4.a;
        ctx.translate(W/2,H*0.62);ctx.scale(f4.s,f4.s);ctx.translate(-W/2,-H*0.62);

        const pulse=0.85+0.15*Math.sin(t/200);
        ctx.globalAlpha=f4.a*pulse;
        roundRect(15,H*0.56,W-30,75,16,G800);
        ctx.fillStyle='#fff';ctx.font='800 22px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('REVENEZ PUBLIER',W/2,H*0.59+10);
        ctx.fillStyle=GOLD;ctx.font='800 26px "Segoe UI",sans-serif';
        ctx.fillText('ENCORE ! 🔥',W/2,H*0.59+42);
        ctx.restore();
    }

    // Subtitle
    const f5=fadeUp(t,5000,500);
    ctx.globalAlpha=f5.a;ctx.fillStyle=G200;
    ctx.font='italic 13px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Découvrez ce que vous ne saviez',W/2,H*0.80+f5.y);
    ctx.fillText('peut-être pas encore...',W/2,H*0.80+20+f5.y);

    // Arrow
    if(t>5200){
        ctx.globalAlpha=0.3+0.7*Math.abs(Math.sin(t/300));
        ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('↓',W/2,H-25);
    }
    ctx.globalAlpha=1;
}

// ============================================================
// S2: 5 ARTICLES x 5 JOURS + comparison WhatsApp (6000-15000)
// ============================================================
function drawS2(t){
    const grd=ctx.createLinearGradient(0,0,W,H);
    grd.addColorStop(0,'#0D3B14');grd.addColorStop(1,G900);
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    drawParticles(t,10,G300);

    // Title
    const ft=fadeUp(t,100,400);
    ctx.globalAlpha=ft.a;ctx.fillStyle='#fff';
    ctx.font='700 18px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Le saviez-vous ? 🤔',W/2,35+ft.y);
    ctx.globalAlpha=1;

    // Card 1: 5 articles
    const f1=slideL(t,600,600);
    if(f1.a>0){
        ctx.globalAlpha=f1.a;
        roundRect(15+f1.x,60,W-30,95,16,'rgba(76,175,80,0.08)','rgba(76,175,80,0.3)');

        // Big number
        ctx.fillStyle=G400;ctx.font='900 48px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText('5',30+f1.x,118);
        ctx.fillStyle='#fff';ctx.font='700 16px "Segoe UI",sans-serif';
        ctx.fillText('articles différents',85+f1.x,95);
        ctx.fillStyle=G200;ctx.font='400 12px "Segoe UI",sans-serif';
        ctx.fillText('Publiez jusqu\'à 5 articles en même',85+f1.x,118);
        ctx.fillText('temps sur le site !',85+f1.x,134);
    }

    // Card 2: 5 jours
    const f2=slideR(t,1600,600);
    if(f2.a>0){
        ctx.globalAlpha=f2.a;
        roundRect(15+f2.x,170,W-30,95,16,'rgba(249,168,37,0.08)','rgba(249,168,37,0.3)');

        ctx.fillStyle=GOLD;ctx.font='900 48px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText('5',30+f2.x,228);
        ctx.fillStyle='#fff';ctx.font='700 16px "Segoe UI",sans-serif';
        ctx.fillText('jours de visibilité',85+f2.x,205);
        ctx.fillStyle=G200;ctx.font='400 12px "Segoe UI",sans-serif';
        ctx.fillText('Chaque article reste visible pendant',85+f2.x,228);
        ctx.fillText('5 jours complets !',85+f2.x,244);
    }

    // VS COMPARISON: WhatsApp vs Plannie
    if(t>2800){
        const fvs=fadeUp(t,2800,500);
        ctx.globalAlpha=fvs.a;

        ctx.fillStyle='#fff';ctx.font='700 14px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Pendant que sur WhatsApp...',W/2,290+fvs.y);

        // WhatsApp side
        const leftW=(W-50)/2;
        roundRect(15,310+fvs.y,leftW,140,14,null,'rgba(37,211,102,0.3)');
        ctx.fillStyle=WA_GREEN;ctx.font='700 11px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Story WhatsApp',15+leftW/2,332+fvs.y);

        // Timer showing 24h
        ctx.beginPath();ctx.arc(15+leftW/2,375+fvs.y,25,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=3;ctx.stroke();
        // Filled portion (small = short time)
        ctx.beginPath();ctx.arc(15+leftW/2,375+fvs.y,25,-Math.PI/2,-Math.PI/2+Math.PI*0.16);ctx.strokeStyle=WA_GREEN;ctx.lineWidth=4;ctx.stroke();
        ctx.lineWidth=1;
        ctx.fillStyle='#fff';ctx.font='700 13px "Segoe UI",sans-serif';
        ctx.fillText('24h',15+leftW/2,380+fvs.y);

        ctx.fillStyle=RED;ctx.font='700 11px "Segoe UI",sans-serif';
        ctx.fillText('❌ Disparaît !',15+leftW/2,422+fvs.y);

        // Plannie side
        const rx=W/2+10;
        roundRect(rx,310+fvs.y,leftW,140,14,null,'rgba(76,175,80,0.3)');
        ctx.fillStyle=G400;ctx.font='700 11px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Plannie Business',rx+leftW/2,332+fvs.y);

        // Timer showing 5 days (much larger arc)
        ctx.beginPath();ctx.arc(rx+leftW/2,375+fvs.y,25,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=3;ctx.stroke();
        // 5 days = 120h, so 5x the proportion
        const fillAngle=t>3800?Math.min((t-3800)/800,1)*Math.PI*2:0;
        ctx.beginPath();ctx.arc(rx+leftW/2,375+fvs.y,25,-Math.PI/2,-Math.PI/2+fillAngle);ctx.strokeStyle=G400;ctx.lineWidth=4;ctx.stroke();
        ctx.lineWidth=1;
        ctx.fillStyle='#fff';ctx.font='700 13px "Segoe UI",sans-serif';
        ctx.fillText('5 JOURS',rx+leftW/2,380+fvs.y);

        ctx.fillStyle=G400;ctx.font='700 11px "Segoe UI",sans-serif';
        ctx.fillText('✅ Reste en ligne !',rx+leftW/2,422+fvs.y);
    }

    // Result label
    if(t>5000){
        const fr=fadeUp(t,5000,400);
        ctx.globalAlpha=fr.a;
        roundRect(20,465+fr.y,W-40,50,14,G800);
        ctx.fillStyle='#fff';ctx.font='700 14px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('5x plus longtemps que WhatsApp ! 💪',W/2,496+fr.y);
    }

    // Bottom: article examples scrolling
    if(t>6000){
        const fa=fadeIn(t,6000,500);
        ctx.globalAlpha=fa.a*0.7;
        const scroll=(t-6000)*0.03;
        // Mini article cards scrolling
        const articles=[
            {img:imgs.drap,name:'2 Drap+Oreiller',price:'35.000 FC'},
            {img:imgs.riz,name:'Riz+Spaghetti',price:'3.000 FC'},
            {img:imgs.hannah,name:'HANNAH',price:'20.000 FC'},
        ];
        articles.forEach((art,i)=>{
            const ax=20+i*130-scroll%390;
            if(ax>-130&&ax<W+10){
                roundRect(ax,540,115,70,10,'rgba(255,255,255,0.05)');
                drawImgCoverRound(art.img,ax+4,544,107,38,6,fa.a*0.7);
                ctx.fillStyle='#fff';ctx.font='600 8px "Segoe UI",sans-serif';ctx.textAlign='left';
                ctx.fillText(art.name,ax+6,598);
                ctx.fillStyle=G300;ctx.font='400 7px "Segoe UI",sans-serif';
                ctx.fillText(art.price,ax+6,609);
            }
        });
    }

    ctx.globalAlpha=1;
}

// ============================================================
// S3: REPUBLIER + Grand public + Lien circule (15000-23000)
// ============================================================
function drawS3(t){
    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);

    // Title
    const ft=fadeUp(t,100,400);
    ctx.globalAlpha=ft.a;ctx.fillStyle='#fff';
    ctx.font='700 17px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Et au bout de 5 jours ?',W/2,35+ft.y);
    ctx.globalAlpha=1;

    // REPUBLIER cycle visual
    const f1=fadeUp(t,700,600);
    if(f1.a>0){
        ctx.globalAlpha=f1.a;

        // Circular arrows (refresh cycle)
        const cx=W/2,cy=130+f1.y,cr=40;
        ctx.strokeStyle=G400;ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(cx,cy,cr,0.2,Math.PI*1.5);ctx.stroke();
        // Arrow head
        const ax=cx+cr*Math.cos(0.2),ay=cy+cr*Math.sin(0.2);
        ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+8,ay-5);ctx.lineTo(ax+3,ay+8);ctx.closePath();ctx.fillStyle=G400;ctx.fill();
        ctx.lineWidth=1;

        ctx.fillStyle=G400;ctx.font='700 13px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('REPUBLIER',cx,cy+5);
    }

    // Text block
    const f2=fadeUp(t,1500,500);
    if(f2.a>0){
        ctx.globalAlpha=f2.a;
        roundRect(15,185+f2.y,W-30,90,14,'rgba(76,175,80,0.08)','rgba(76,175,80,0.3)');

        ctx.fillStyle='#fff';ctx.font='700 14px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Republiez le même article',W/2,210+f2.y);
        ctx.fillText('avec des infos mises à jour ! 🔄',W/2,232+f2.y);
        ctx.fillStyle=G200;ctx.font='400 11px "Segoe UI",sans-serif';
        ctx.fillText('Nouveaux prix, nouvelles photos, nouveau stock...',W/2,256+f2.y);
    }

    // GRAND PUBLIC section
    const f3=fadeUp(t,3000,600);
    if(f3.a>0){
        ctx.globalAlpha=f3.a;
        roundRect(15,295+f3.y,W-30,80,14,'rgba(249,168,37,0.06)','rgba(249,168,37,0.25)');

        ctx.fillStyle=GOLD;ctx.font='700 15px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('🌍 Un GRAND public',W/2,318+f3.y);
        ctx.fillStyle='#fff';ctx.font='400 12px "Segoe UI",sans-serif';
        ctx.fillText('Votre article est exposé à tous',W/2,340+f3.y);
        ctx.fillText('les visiteurs du site !',W/2,357+f3.y);
    }

    // LIEN QUI CIRCULE
    const f4=fadeUp(t,4500,600);
    if(f4.a>0){
        ctx.globalAlpha=f4.a;
        roundRect(15,395+f4.y,W-30,110,14,'rgba(21,101,192,0.06)','rgba(21,101,192,0.25)');

        ctx.fillStyle=BLUE;ctx.font='700 15px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('🔗 Le lien fait le tour !',W/2,418+f4.y);
        ctx.fillStyle='#fff';ctx.font='400 12px "Segoe UI",sans-serif';
        ctx.fillText('Les gens partagent le lien du site.',W/2,442+f4.y);
        ctx.fillText('Votre article continue d\'être vu',W/2,460+f4.y);
        ctx.fillText('même quand VOUS ne partagez pas ! 📲',W/2,478+f4.y);

        // Animated chain of share icons
        if(t>5200){
            const bounce=Math.sin(t/300)*4;
            ctx.globalAlpha=f4.a*(0.4+0.3*Math.abs(Math.sin(t/400)));
            ctx.font='16px sans-serif';ctx.textAlign='center';
            for(let i=0;i<5;i++){
                const sx=40+i*75;
                ctx.fillText('📤',sx,505+f4.y+bounce*(i%2?1:-1));
            }
        }
    }

    // Bottom text
    const f5=fadeUp(t,6500,400);
    ctx.globalAlpha=f5.a*0.5;ctx.fillStyle=G300;
    ctx.font='italic 12px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Plus vous publiez, plus vous êtes visible.',W/2,560+f5.y);

    ctx.globalAlpha=1;
}

function renderFrame(gt){
    ctx.save();ctx.clearRect(0,0,W,H);
    try{

let actx,masterGain,audioDest;
function initAudio(rec){actx=new(window.AudioContext||window.webkitAudioContext)();masterGain=actx.createGain();masterGain.gain.value=0.8;masterGain.connect(actx.destination);if(rec){audioDest=actx.createMediaStreamDestination();masterGain.connect(audioDest)}}
function playTone(f,dur,type='sine',vol=0.15){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);o.connect(g);g.connect(masterGain);o.start();o.stop(actx.currentTime+dur)}
function sfxWhoosh(){if(!actx)return;const n=actx.sampleRate*0.35,buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)*0.25;const s=actx.createBufferSource();s.buffer=buf;const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=0.8;bp.frequency.exponentialRampToValueAtTime(2200,actx.currentTime+0.3);s.connect(bp);bp.connect(masterGain);s.start()}

function sfxSuccess(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.3,'sine',.1),i*100))}
function sfxRise(){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(200,actx.currentTime);o.frequency.exponentialRampToValueAtTime(800,actx.currentTime+0.6);g.gain.setValueAtTime(0.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.7);o.connect(g);g.connect(masterGain);o.start();o.stop(actx.currentTime+0.7)}
function sfxClick(){playTone(1200,.05,'square',.06)}
function sfxBeat(){playTone(70,.08,'sine',.03)}
function sfxChime(){playTone(1047,.3,'sine',.08);setTimeout(()=>playTone(1319,.25,'sine',.06),120);setTimeout(()=>playTone(1568,.3,'sine',.05),240);setTimeout(()=>playTone(2093,.4,'sine',.04),360)}
function sfxAlert(){playTone(880,.15,'square',.1);setTimeout(()=>playTone(880,.15,'square',.1),200)}
let bgInt;function startBg(){bgInt=setInterval(()=>sfxBeat(),500)}function stopBg(){clearInterval(bgInt)}

function scheduleSounds(){
    const ev=[
        [0,sfxRise],[300,sfxPop],[600,sfxDing],[1800,sfxPop],[3000,sfxPop],[3800,sfxChime],[5000,sfxPop],
        [6000,sfxWhoosh],[6600,sfxPop],[7600,sfxPop],[8800,sfxDing],[11000,sfxPop],[13000,sfxPop],
        [15000,sfxWhoosh],[15200,sfxPop],[16200,sfxDing],[18000,sfxPop],[19500,sfxPop],[21500,sfxPop],
        [23000,sfxWhoosh],[23200,sfxPop],[25200,sfxClick],[27000,sfxDing],[29000,sfxPop],[30500,sfxPop],
        [33000,sfxWhoosh],[33200,sfxDing],[35000,sfxPop],[37500,sfxPop],[39500,sfxPop],[40000,sfxPop],[40500,sfxPop],
        [43000,sfxRise],[43200,sfxChime],[44000,sfxPop],[44500,sfxPop],[45000,sfxPop],[45500,sfxPop],[46000,sfxPop],[46500,sfxPop],[47000,sfxPop],[48000,sfxSuccess],[50000,sfxDing],
        [53000,sfxRise],[54000,sfxPop],[56000,sfxDing],[58000,sfxPop],[59500,sfxPop],[60000,sfxPop],[60500,sfxChime],
    ];
    ev.forEach(([t,fn])=>setTimeout(fn,t));
    setTimeout(stopBg,53000);
}

let isRunning=false;
function runAd(download){
    if(isRunning)return;
    if(imgsLoaded<imgsTotal){document.getElementById('status').textContent='Chargement des images...';setTimeout(()=>runAd(download),500);return}
    isRunning=true;
    const btnP=document.getElementById('btnPlay'),btnD=document.getElementById('btnDl'),st=document.getElementById('status');
    btnP.disabled=true;btnD.disabled=true;
    initAudio(download);let recorder,chunks=[];
    if(download){
        st.textContent='Enregistrement en cours... ~1 min 2 sec';
        const vs=cv.captureStream(FPS);
        if(audioDest)audioDest.stream.getAudioTracks().forEach(t=>vs.addTrack(t));
        const mt=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';
        recorder=new MediaRecorder(vs,{mimeType:mt,videoBitsPerSecond:3000000});
        recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
        recorder.onstop=()=>{
            const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);
            const a=document.createElement('a');a.href=url;a.download='Plannie_Business_RevenezPublier.webm';
            document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
            st.textContent='Video téléchargée !';
        };recorder.start();
    }else{st.textContent='Lecture en cours...'}
    startBg();scheduleSounds();
    const t0=performance.now();
    function loop(now){
        const elapsed=now-t0;renderFrame(Math.min(elapsed,DURATION));
        if(elapsed<DURATION+500){requestAnimationFrame(loop)}
        else{if(recorder&&recorder.state==='recording')recorder.stop();isRunning=false;btnP.disabled=false;btnD.disabled=false;if(!download)st.textContent='Lecture terminée'}
    }
    requestAnimationFrame(loop);
}
renderFrame(0);
