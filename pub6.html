<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plannie Business – Pub 2 : Le site en action</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:#000;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;
    overflow:hidden;gap:16px;
}
canvas{border-radius:16px;box-shadow:0 0 60px rgba(76,175,80,.25);max-width:95vw;max-height:80vh}
@media(max-width:400px){canvas{border-radius:0}}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 28px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:8px}
.btn-play{background:#2E7D32;color:#fff}.btn-play:hover{background:#388E3C}
.btn-dl{background:#fff;color:#2E7D32}.btn-dl:hover{background:#E8F5E9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{color:rgba(255,255,255,.5);font-size:13px;min-height:18px}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<div class="controls">
    <button class="btn btn-play" id="btnPlay" onclick="runAd(false)">▶ Lancer la pub</button>
    <button class="btn btn-dl" id="btnDl" onclick="runAd(true)">📥 Télécharger la vidéo</button>
</div>
<div class="status" id="status"></div>

<script>
// ============================================================
//  Plannie Business — Pub 2 : Le site en action
//  Mockups réalistes de l'application
// ============================================================
const W=360, H=640, FPS=30, DURATION=62000;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

const G900='#1B5E20',G800='#2E7D32',G700='#388E3C',G600='#43A047',G500='#4CAF50',
      G400='#66BB6A',G300='#81C784',G200='#A5D6A7',G100='#C8E6C9',G50='#E8F5E9';
const GOLD='#F9A825',ORANGE='#EF6C00',BLUE='#1565C0';
const SITE_URL='plannie-business.onrender.com';
const PHONE='+243 979 508 196';

// ============ IMAGE LOADING ============
const imgFiles={
    logo:      'img/plannie_logo_1792797585289.jpg',
    cover:     'img/plannie_cover_1792799845450.jpg',
    happy:     'img/plannie_happy_result_1792799871450.jpg',
    problem:   'img/plannie_market_problem_1792799857414.jpg',
    chapatte:  'exp/chapatte_500_chez_colodouce.jpg',
    chapatte2: 'exp/chapatte_500_chez_colodouce2.jpg',
    gauffres:  'exp/gauffres_3pcs_a_1000_chez_colodouce.jpg',
    riz:       'exp/Riz+Sauce+Viande_4000_chez_Bondo_Food.jpg',
    tissage:   'exp/tissage_et_closur_40000FC_chez_chriska_business.jpg',
};
const imgs={};
let imgsLoaded=0, imgsTotal=Object.keys(imgFiles).length;
Object.entries(imgFiles).forEach(([k,src])=>{
    const im=new Image();
    im.onload=()=>{imgsLoaded++};im.onerror=()=>{imgsLoaded++};
    im.src=src;imgs[k]=im;
});

// ============ HELPERS ============
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeInOut(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function fadeUp(t,delay,dur=500){const p=clamp((t-delay)/dur,0,1);return{a:easeOut(p),y:25*(1-easeOut(p))}}
function fadeIn(t,delay,dur=500){return{a:easeOut(clamp((t-delay)/dur,0,1))}}
function slideL(t,delay,dur=500){const p=clamp((t-delay)/dur,0,1);return{a:easeOut(p),x:-40*(1-easeOut(p))}}
function popScale(t,delay,dur=400){const p=clamp((t-delay)/dur,0,1);const s=p<.7?p/.7*1.15:1.15-(p-.7)/.3*.15;return{a:Math.min(p*2,1),s}}

function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    if(r>0){
        ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
        ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
        ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
        ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    } else {
        ctx.rect(x,y,w,h);
    }
    ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();ctx.lineWidth=1}
}

function drawProgress(t){
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(0,H-4,W,4);
    const grd=ctx.createLinearGradient(0,0,W*(t/DURATION),0);
    grd.addColorStop(0,G400);grd.addColorStop(1,'#fff');
    ctx.fillStyle=grd;ctx.fillRect(0,H-4,W*(t/DURATION),4);
}

function drawBadge(x,y,text,bg,fg='#fff'){
    ctx.font='700 11px "Segoe UI",sans-serif';
    const tw=ctx.measureText(text).width;
    roundRect(x-tw/2-12,y-11,tw+24,24,12,bg);
    ctx.fillStyle=fg;ctx.textAlign='center';
    ctx.fillText(text,x,y+4);
}

function drawParticles(t,count=15,color=G400){
    for(let i=0;i<count;i++){
        const px=(Math.sin(t/800+i*2.1)*0.4+0.5)*W;
        const py=(Math.cos(t/600+i*1.7)*0.4+0.5)*H;
        const sz=2+Math.sin(t/400+i)*2;
        ctx.globalAlpha=0.15+Math.sin(t/500+i)*0.1;
        ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);
        ctx.fillStyle=color;ctx.fill();
    }
    ctx.globalAlpha=1;
}

function drawImgCover(img,x,y,w,h,alpha,zoom=1,panX=0,panY=0){
    if(!img||!img.complete||!img.naturalWidth)return;
    ctx.save();ctx.globalAlpha=alpha;
    ctx.beginPath();roundRect(x,y,w,h,0);ctx.clip();
    const iAR=img.naturalWidth/img.naturalHeight;
    const cAR=w/h;
    let sw,sh;
    if(iAR>cAR){sh=h*zoom;sw=sh*iAR}else{sw=w*zoom;sh=sw/iAR}
    ctx.drawImage(img,x+(w-sw)/2+panX,y+(h-sh)/2+panY,sw,sh);
    ctx.restore();
}

function drawVignette(intensity=0.6){
    const grd=ctx.createRadialGradient(W/2,H/2,W*0.3,W/2,H/2,W*0.9);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(1,`rgba(0,0,0,${intensity})`);
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
}

function wrapText(text,x,y,maxW,lineH){
    const words=text.split(' ');let line='';
    for(const w of words){
        const test=line+w+' ';
        if(ctx.measureText(test).width>maxW&&line!==''){
            ctx.fillText(line.trim(),x,y);y+=lineH;line=w+' ';
        }else{line=test}
    }
    ctx.fillText(line.trim(),x,y);
    return y+lineH;
}

// ============================================================
//  PHONE MOCKUP DRAWING SYSTEM
// ============================================================
function drawPhoneFrame(x,y,w,h,alpha=1){
    ctx.save();ctx.globalAlpha=alpha;
    // Shadow
    ctx.shadowColor='rgba(0,0,0,0.3)';ctx.shadowBlur=20;ctx.shadowOffsetY=5;
    roundRect(x,y,w,h,18,'#1a1a1a');
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    // Inner screen bezel
    roundRect(x+3,y+3,w-6,h-6,16,'#000');
    ctx.restore();
}

function drawStatusBar(x,y,w){
    // Status bar background
    roundRect(x,y,w,20,0,G800);
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='600 9px "Segoe UI",sans-serif';ctx.textAlign='left';
    ctx.fillText('14:32',x+8,y+14);
    ctx.textAlign='right';
    ctx.fillText('87%  🔋',x+w-8,y+14);
    // WiFi dots
    ctx.fillText('📶',x+w-55,y+14);
}

// Draw the Plannie logo SVG-like on canvas
function drawPlannieLogo(cx,cy,size){
    const s=size/80;
    ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
    // Right leaf
    ctx.fillStyle=G800;ctx.globalAlpha=0.9;
    ctx.beginPath();ctx.moveTo(0,18);ctx.bezierCurveTo(0,-2,14,-22,30,-32);
    ctx.bezierCurveTo(18,-20,10,-4,8,16);ctx.closePath();ctx.fill();
    // Left leaf
    ctx.fillStyle=G500;ctx.globalAlpha=0.8;
    ctx.beginPath();ctx.moveTo(0,18);ctx.bezierCurveTo(0,-2,-14,-22,-30,-32);
    ctx.bezierCurveTo(-18,-20,-10,-4,-8,16);ctx.closePath();ctx.fill();
    // Stem
    ctx.globalAlpha=1;ctx.fillStyle=G800;
    roundRect(-2,16,4,14,2,G800);
    // Dollar circle
    ctx.fillStyle=G400;ctx.globalAlpha=0.55;
    ctx.beginPath();ctx.arc(18,-14,9,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
    ctx.fillText('$',18,-10);
    ctx.restore();
}

// ============================================================
//  MOCKUP: HOME PAGE
// ============================================================
function drawMockupHome(x,y,w,h,alpha,articleImg,scrollY=0){
    if(alpha<=0)return;
    ctx.save();ctx.globalAlpha=alpha;
    // Clip to screen area
    ctx.beginPath();roundRect(x,y,w,h,14);ctx.clip();

    // Screen bg
    roundRect(x,y,w,h,0,'#F6F9F6');

    const sx=x, sy=y-scrollY;

    // Status bar
    drawStatusBar(x,y,w);

    // Hero section
    const heroH=110;
    const heroGrd=ctx.createLinearGradient(x,sy+20,x,sy+20+heroH);
    heroGrd.addColorStop(0,G50);heroGrd.addColorStop(1,'#fff');
    roundRect(x,sy+20,w,heroH,0,heroGrd);
    // Border bottom
    ctx.fillStyle=G100;ctx.fillRect(x,sy+20+heroH,w,1);

    // Logo
    drawPlannieLogo(x+w/2,sy+50,42);
    ctx.fillStyle=G800;ctx.font='700 16px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Plannie Business',x+w/2,sy+82);
    ctx.fillStyle='#5F6368';ctx.font='italic 8px "Segoe UI",sans-serif';
    ctx.fillText('La Story visible sur la planète entière',x+w/2,sy+94);

    // Hero button
    const btnGrd=ctx.createLinearGradient(x+20,0,x+w-20,0);
    btnGrd.addColorStop(0,G800);btnGrd.addColorStop(1,G600);
    roundRect(x+15,sy+102,w-30,22,8,btnGrd);
    ctx.fillStyle='#fff';ctx.font='600 9px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('📝  Demander une publication de mon article',x+w/2,sy+116);

    // Slider section title
    ctx.fillStyle=G800;ctx.font='600 12px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('📦 Articles en vitrine',x+w/2,sy+150);

    // Article card
    const cardX=x+20, cardY=sy+160, cardW=w-40, cardH=260;
    // Card shadow
    ctx.shadowColor='rgba(0,0,0,0.08)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
    roundRect(cardX,cardY,cardW,cardH,10,'#fff');
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

    // Article image
    if(articleImg&&articleImg.complete&&articleImg.naturalWidth){
        ctx.save();
        ctx.beginPath();roundRect(cardX+4,cardY+4,cardW-8,130,8);ctx.clip();
        const iAR=articleImg.naturalWidth/articleImg.naturalHeight;
        const cAR=(cardW-8)/130;
        let sw2,sh2;
        if(iAR>cAR){sh2=130;sw2=sh2*iAR}else{sw2=cardW-8;sh2=sw2/iAR}
        ctx.drawImage(articleImg,cardX+4+((cardW-8)-sw2)/2,cardY+4+(130-sh2)/2,sw2,sh2);
        ctx.restore();
    } else {
        roundRect(cardX+4,cardY+4,cardW-8,130,8,G50);
        ctx.font='30px sans-serif';ctx.textAlign='center';
        ctx.fillText('📦',cardX+cardW/2,cardY+75);
    }

    // Badge clicks
    roundRect(cardX+cardW-55,cardY+10,48,18,9,'rgba(0,0,0,0.55)');
    ctx.fillStyle='#fff';ctx.font='600 9px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('👁 247',cardX+cardW-31,cardY+23);

    // Card body
    ctx.textAlign='left';
    // Category
    roundRect(cardX+10,cardY+142,55,14,4,G50);
    ctx.fillStyle=G800;ctx.font='600 8px "Segoe UI",sans-serif';
    ctx.fillText('Nourriture',cardX+16,cardY+152);

    // Name
    ctx.fillStyle='#1A1A1A';ctx.font='700 13px "Segoe UI",sans-serif';
    ctx.fillText('Chapatte',cardX+10,cardY+170);

    // Description
    ctx.fillStyle='#5F6368';ctx.font='400 9px "Segoe UI",sans-serif';
    ctx.fillText('Délicieuse chapatte fraîche du jour.',cardX+10,cardY+184);

    // Stars
    ctx.fillStyle=GOLD;ctx.font='12px sans-serif';
    ctx.fillText('★★★★★',cardX+10,cardY+200);
    ctx.fillStyle='#888';ctx.font='400 8px "Segoe UI",sans-serif';
    ctx.fillText('(12)',cardX+65,cardY+200);

    // Price
    ctx.fillStyle=G800;ctx.font='800 14px "Segoe UI",sans-serif';
    ctx.fillText('500 FC',cardX+10,cardY+218);
    ctx.fillStyle='#888';ctx.font='400 9px "Segoe UI",sans-serif';
    ctx.fillText('🏪 Colo Douce',cardX+10,cardY+232);

    // Buttons
    roundRect(cardX+8,cardY+240,cardW/2-14,18,6,G500);
    ctx.fillStyle='#fff';ctx.font='700 9px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('💬 WhatsApp',cardX+8+(cardW/2-14)/2,cardY+252);

    roundRect(cardX+cardW/2+4,cardY+240,cardW/2-14,18,6,null,G800);
    ctx.fillStyle=G800;ctx.font='600 9px "Segoe UI",sans-serif';
    ctx.fillText('Détails ›',cardX+cardW/2+4+(cardW/2-14)/2,cardY+252);

    // Slider dots
    for(let i=0;i<4;i++){
        ctx.beginPath();ctx.arc(x+w/2-15+i*10,cardY+cardH+12,3,0,Math.PI*2);
        ctx.fillStyle=i===0?G800:'#ccc';ctx.fill();
    }

    ctx.restore();
}

// ============================================================
//  MOCKUP: ARTICLE DETAIL PAGE
// ============================================================
function drawMockupDetail(x,y,w,h,alpha,articleImg){
    if(alpha<=0)return;
    ctx.save();ctx.globalAlpha=alpha;
    ctx.beginPath();roundRect(x,y,w,h,14);ctx.clip();

    roundRect(x,y,w,h,0,'#F6F9F6');
    drawStatusBar(x,y,w);

    // Header image
    const imgH=140;
    if(articleImg&&articleImg.complete){
        ctx.save();
        ctx.beginPath();ctx.rect(x,y+20,w,imgH);ctx.clip();
        const iAR=articleImg.naturalWidth/articleImg.naturalHeight;
        const cAR=w/imgH;
        let sw2,sh2;
        if(iAR>cAR){sh2=imgH;sw2=sh2*iAR}else{sw2=w;sh2=sw2/iAR}
        ctx.drawImage(articleImg,x+(w-sw2)/2,y+20+(imgH-sh2)/2,sw2,sh2);
        ctx.restore();
    } else {
        roundRect(x,y+20,w,imgH,0,G100);
    }

    // Close button
    ctx.beginPath();ctx.arc(x+w-20,y+35,12,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fill();
    ctx.fillStyle='#fff';ctx.font='700 14px sans-serif';ctx.textAlign='center';
    ctx.fillText('✕',x+w-20,y+40);

    // Detail body
    const bx=x+12, by=y+20+imgH+10;
    // Category
    roundRect(bx,by,55,14,4,G50);
    ctx.fillStyle=G800;ctx.font='600 8px "Segoe UI",sans-serif';ctx.textAlign='left';
    ctx.fillText('Nourriture',bx+6,by+10);

    // Name
    ctx.fillStyle=G800;ctx.font='700 18px "Segoe UI",sans-serif';
    ctx.fillText('Riz + Sauce + Viande',bx,by+32);

    // Stars
    ctx.fillStyle=GOLD;ctx.font='14px sans-serif';
    ctx.fillText('★★★★☆',bx,by+50);
    ctx.fillStyle='#888';ctx.font='400 9px "Segoe UI",sans-serif';
    ctx.fillText('4.2/5 (8 avis)',bx+65,by+50);

    // Price
    ctx.fillStyle=G800;ctx.font='800 20px "Segoe UI",sans-serif';
    ctx.fillText('4.000 FC',bx,by+74);

    // Section: Description
    ctx.fillStyle='#888';ctx.font='600 9px "Segoe UI",sans-serif';
    ctx.fillText('Description',bx,by+94);
    ctx.fillStyle='#333';ctx.font='400 10px "Segoe UI",sans-serif';
    wrapText('Riz bien cuit avec sauce tomate et viande de bœuf. Repas complet et nourrissant !',bx,by+108,w-28,13);

    // Section: Disponibilité
    ctx.fillStyle='#888';ctx.font='600 9px "Segoe UI",sans-serif';
    ctx.fillText('Disponibilité',bx,by+140);
    roundRect(bx,by+146,60,14,4,'rgba(76,175,80,0.15)');
    ctx.fillStyle=G800;ctx.font='600 8px "Segoe UI",sans-serif';
    ctx.fillText('✅ En stock',bx+6,by+156);

    // Section: Entreprise
    ctx.fillStyle='#888';ctx.font='600 9px "Segoe UI",sans-serif';
    ctx.fillText('Entreprise',bx,by+174);
    ctx.fillStyle='#1a1a1a';ctx.font='700 11px "Segoe UI",sans-serif';
    ctx.fillText('Bondo Food',bx,by+188);
    ctx.fillStyle='#5F6368';ctx.font='400 9px "Segoe UI",sans-serif';
    ctx.fillText('📍 Lubumbashi',bx,by+202);

    // Section: Social links
    ctx.fillStyle='#888';ctx.font='600 9px "Segoe UI",sans-serif';
    ctx.fillText('Réseaux sociaux',bx,by+220);
    const socials=['📘 Facebook','📸 Instagram','🎵 TikTok'];
    socials.forEach((s,i)=>{
        roundRect(bx+i*72,by+226,68,16,6,G50,G300);
        ctx.fillStyle=G800;ctx.font='500 8px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText(s,bx+i*72+34,by+237);
    });
    ctx.textAlign='left';

    // WhatsApp CTA button
    roundRect(bx,by+252,w-28,24,8,G800);
    ctx.fillStyle='#fff';ctx.font='700 11px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('💬 Contacter sur WhatsApp',x+w/2,by+268);

    // Views
    ctx.fillStyle='#888';ctx.font='400 8px "Segoe UI",sans-serif';
    ctx.fillText('👁 156 vues',x+w/2,by+290);

    ctx.restore();
}

// ============================================================
//  MOCKUP: SUBMISSION FORM
// ============================================================
function drawMockupForm(x,y,w,h,alpha,fillProgress=0){
    if(alpha<=0)return;
    ctx.save();ctx.globalAlpha=alpha;
    ctx.beginPath();roundRect(x,y,w,h,14);ctx.clip();

    roundRect(x,y,w,h,0,'#F6F9F6');
    drawStatusBar(x,y,w);

    // Mini hero
    roundRect(x,y+20,w,55,0,G50);
    ctx.fillStyle=G100;ctx.fillRect(x,y+75,w,1);
    drawPlannieLogo(x+w/2,y+40,28);
    ctx.fillStyle=G800;ctx.font='700 12px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Plannie Business',x+w/2,y+62);

    // Back link
    ctx.fillStyle=G800;ctx.font='400 9px "Segoe UI",sans-serif';ctx.textAlign='left';
    ctx.fillText('← Retour à l\'accueil',x+12,y+86);

    // Form section 1
    const sx=x+10, fw=w-20;
    let fy=y+96;

    // Section: Article info
    roundRect(sx,fy,fw,0,0); // just positioning
    ctx.fillStyle=G800;ctx.font='700 10px "Segoe UI",sans-serif';ctx.textAlign='left';
    ctx.fillText('📦 Renseignements sur l\'article',sx+4,fy+10);
    fy+=18;

    // Field: Image
    ctx.fillStyle='#888';ctx.font='500 8px "Segoe UI",sans-serif';
    ctx.fillText('Image de l\'article *',sx+4,fy+8);
    roundRect(sx+4,fy+12,fw-8,22,6,'#fff','#D0D5D0');
    if(fillProgress>0){
        ctx.fillStyle='#555';ctx.font='400 8px "Segoe UI",sans-serif';
        ctx.fillText('📷 chapatte.jpg',sx+12,fy+26);
    }
    fy+=40;

    // Field: Name
    ctx.fillStyle='#888';ctx.font='500 8px "Segoe UI",sans-serif';
    ctx.fillText('Nom de l\'article *',sx+4,fy+8);
    roundRect(sx+4,fy+12,fw-8,22,6,'#fff','#D0D5D0');
    if(fillProgress>0.15){
        ctx.fillStyle='#1a1a1a';ctx.font='400 9px "Segoe UI",sans-serif';
        ctx.fillText('Chapatte',sx+12,fy+26);
    }
    fy+=40;

    // Field: Description
    ctx.fillStyle='#888';ctx.font='500 8px "Segoe UI",sans-serif';
    ctx.fillText('Brève description *',sx+4,fy+8);
    roundRect(sx+4,fy+12,fw-8,30,6,'#fff','#D0D5D0');
    if(fillProgress>0.3){
        ctx.fillStyle='#1a1a1a';ctx.font='400 8px "Segoe UI",sans-serif';
        wrapText('Délicieuse chapatte fraîche faite maison',sx+12,fy+24,fw-24,11);
    }
    fy+=48;

    // Section: Price
    ctx.fillStyle=G800;ctx.font='700 10px "Segoe UI",sans-serif';
    ctx.fillText('💰 Description du prix',sx+4,fy+10);
    fy+=18;

    // Field: Price
    ctx.fillStyle='#888';ctx.font='500 8px "Segoe UI",sans-serif';

// ============ MASTER RENDER ============
const scenes=[
    {start:0,     end:6500,  draw:drawS1},
    {start:6500,  end:15000, draw:drawS2},
    {start:15000, end:23000, draw:drawS3},
    {start:23000, end:33000, draw:drawS4},
    {start:33000, end:40000, draw:drawS5},
    {start:40000, end:47000, draw:drawS6},
    {start:47000, end:53000, draw:drawS7},
    {start:53000, end:62000, draw:drawS8},
];

function renderFrame(gt){
    ctx.save();ctx.clearRect(0,0,W,H);
    for(const sc of scenes){
        if(gt>=sc.start&&gt<sc.end){sc.draw(gt-sc.start);break}
    }
    if(gt>=DURATION) drawS8(9000);
    drawProgress(gt);
    ctx.restore();
}

// ============ AUDIO ============
let actx,masterGain,audioDest;
function initAudio(rec){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=actx.createGain();masterGain.gain.value=0.8;
    masterGain.connect(actx.destination);
    if(rec){audioDest=actx.createMediaStreamDestination();masterGain.connect(audioDest)}
}
function playTone(f,dur,type='sine',vol=0.15){
    if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g);g.connect(masterGain);o.start();o.stop(actx.currentTime+dur);
}
function sfxWhoosh(){
    if(!actx)return;const n=actx.sampleRate*0.35,buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)*0.25;
    const s=actx.createBufferSource();s.buffer=buf;
    const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=0.8;
    bp.frequency.exponentialRampToValueAtTime(2200,actx.currentTime+0.3);
    s.connect(bp);bp.connect(masterGain);s.start();
}
function sfxDing(){playTone(880,.4);setTimeout(()=>playTone(1320,.5,'sine',.1),80);setTimeout(()=>playTone(1760,.5,'sine',.06),160)}
function sfxPop(){playTone(600,.1,'sine',.12);setTimeout(()=>playTone(900,.08,'sine',.08),50)}
function sfxSuccess(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.3,'sine',.1),i*100))}
function sfxRise(){
    if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';
    o.frequency.setValueAtTime(200,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(800,actx.currentTime+0.6);
    g.gain.setValueAtTime(0.08,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.7);
    o.connect(g);g.connect(masterGain);o.start();o.stop(actx.currentTime+0.7);
}
function sfxClick(){playTone(1200,.05,'square',.06)}
function sfxBeat(){playTone(70,.08,'sine',.03)}
function sfxChime(){
    playTone(1047,.3,'sine',.08);setTimeout(()=>playTone(1319,.25,'sine',.06),120);
    setTimeout(()=>playTone(1568,.3,'sine',.05),240);setTimeout(()=>playTone(2093,.4,'sine',.04),360);
}
function sfxType(){playTone(800,.03,'square',.04)}
let bgInt;function startBg(){bgInt=setInterval(()=>sfxBeat(),500)}
function stopBg(){clearInterval(bgInt)}

function scheduleSounds(){
    const ev=[
        [0,sfxRise],[300,sfxDing],[1200,sfxPop],[1800,sfxPop],[3000,sfxPop],[5000,sfxPop],
        [6500,sfxWhoosh],[6700,sfxDing],
        [9000,sfxPop],[9500,sfxPop],[10000,sfxPop],[10500,sfxPop],[11000,sfxPop],[13500,sfxPop],
        [15000,sfxWhoosh],[15200,sfxDing],
        [17000,sfxPop],[18000,sfxPop],[19000,sfxPop],[20000,sfxPop],[21000,sfxPop],
        [23000,sfxWhoosh],[23200,sfxPop],
        [24000,sfxType],[24300,sfxType],[24600,sfxType],[25000,sfxType],[25500,sfxType],
        [26000,sfxType],[26500,sfxType],[27000,sfxType],[27500,sfxType],[28000,sfxType],
        [30500,sfxSuccess],
        [33000,sfxWhoosh],[33200,sfxDing],[33500,sfxPop],
        [35000,sfxPop],[35600,sfxPop],[36200,sfxPop],[36800,sfxPop],
        [38000,sfxPop],[39000,sfxDing],
        [40000,sfxWhoosh],[40200,sfxPop],
        [40500,sfxClick],[41600,sfxClick],[42800,sfxClick],[44000,sfxDing],[45500,sfxSuccess],
        [47000,sfxWhoosh],[47200,sfxDing],
        [47500,sfxPop],[48700,sfxPop],[49900,sfxPop],[51100,sfxPop],
        [53000,sfxRise],[53200,sfxChime],[53800,sfxPop],
        [56000,sfxSuccess],[58000,sfxDing],
    ];
    ev.forEach(([t,fn])=>setTimeout(fn,t));
    setTimeout(stopBg,53000);
}

// ============ PLAYBACK & RECORDING ============
let isRunning=false;
function runAd(download){
    if(isRunning)return;
    if(imgsLoaded<imgsTotal){
        document.getElementById('status').textContent='⏳ Chargement des images...';
        setTimeout(()=>runAd(download),500);return;
    }
    isRunning=true;
    const btnP=document.getElementById('btnPlay'),btnD=document.getElementById('btnDl'),st=document.getElementById('status');
    btnP.disabled=true;btnD.disabled=true;
    initAudio(download);
    let recorder,chunks=[];
    if(download){
        st.textContent='⏺ Enregistrement en cours... 62 secondes';
        const vs=cv.captureStream(FPS);
        if(audioDest)audioDest.stream.getAudioTracks().forEach(t=>vs.addTrack(t));
        const mt=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':
                  MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';
        recorder=new MediaRecorder(vs,{mimeType:mt,videoBitsPerSecond:3000000});
        recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
        recorder.onstop=()=>{
            const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);
            const a=document.createElement('a');a.href=url;a.download='Plannie_Business_Pub2.webm';
            document.body.appendChild(a);a.click();a.remove();
            setTimeout(()=>URL.revokeObjectURL(url),5000);
            st.textContent='✅ Vidéo téléchargée ! (Plannie_Business_Pub2.webm)';
        };
        recorder.start();
    }else{st.textContent='▶ Lecture en cours...'}
    startBg();scheduleSounds();
    const t0=performance.now();
    function loop(now){
        const elapsed=now-t0;renderFrame(Math.min(elapsed,DURATION));
        if(elapsed<DURATION+500){requestAnimationFrame(loop)}
        else{
            if(recorder&&recorder.state==='recording')recorder.stop();
            isRunning=false;btnP.disabled=false;btnD.disabled=false;
            if(!download)st.textContent='✅ Lecture terminée';
        }
    }
    requestAnimationFrame(loop);
}
renderFrame(0);
