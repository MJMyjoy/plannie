<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plannie Business – Pub 13 : Revenez, Republiez !</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;gap:16px}
canvas{border-radius:16px;box-shadow:0 0 60px rgba(76,175,80,.25);max-width:95vw;max-height:80vh}
@media(max-width:400px){canvas{border-radius:0}}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 28px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:8px}
.btn-play{background:#2E7D32;color:#fff}.btn-play:hover{background:#388E3C}
.btn-dl{background:#fff;color:#2E7D32}.btn-dl:hover{background:#E8F5E9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{color:rgba(255,255,255,.5);font-size:13px;min-height:18px}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<div class="controls">
    <button class="btn btn-play" id="btnPlay" onclick="runAd(false)">▶ Lancer la pub</button>
    <button class="btn btn-dl" id="btnDl" onclick="runAd(true)">📥 Télécharger la vidéo</button>
</div>
<div class="status" id="status"></div>

<script>
// ============================================================
//  Plannie Business — Pub 13
//  Nouveaux articles + message aux visiteurs uniques
//  Revenez, republiez, recommandez !
// ============================================================
const W=360, H=640, FPS=30, DURATION=72000;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

const G900='#1B5E20',G800='#2E7D32',G500='#4CAF50',G400='#66BB6A',G300='#81C784',G200='#A5D6A7';
const GOLD='#F9A825',ORANGE='#EF6C00',BLUE='#1565C0',RED='#D32F2F',WA_GREEN='#25D366';
const DARK_BG='#0D1F12';
const SITE='plannie.onrender.com';
const PHONE='+243 979 508 196';

// ── Images ──
const imgFiles={
    bg1:'img/file_01.png',
    bg2:'img/file_02.png',
    logo:'img/plannie_logo_1792797585289.jpg',
    art1:'exp/Babouches de chez ALBI MODE a 20 dollars.jpeg',
    art2:'exp/Parfum mixte de chez Amy business a 20000 FC.jpeg',
    art3:'exp/Poulet sur pieds de chez Acacia Chick a 35 000 FC.jpeg',
    art4:'exp/Savon noir du Ghana, beurre de karit\u00e9 de chez Margueritte cosm\u00e9tique a 25000 FC.jpeg'
};
const imgs={};let imgsLoaded=0,imgsTotal=Object.keys(imgFiles).length;
for(const[k,src] of Object.entries(imgFiles)){
    imgs[k]=new Image();imgs[k].onload=()=>imgsLoaded++;imgs[k].onerror=()=>imgsLoaded++;imgs[k].src=src;
}

// Articles data
const articles=[
    {key:'art1',name:'Babouches',shop:'ALBI MODE',price:'20 \$',col:'#FF7043'},
    {key:'art2',name:'Parfum mixte',shop:'Amy Business',price:'20 000 FC',col:'#AB47BC'},
    {key:'art3',name:'Poulet sur pieds',shop:'Acacia Chick',price:'35 000 FC',col:'#EF5350'},
    {key:'art4',name:'Savon noir + Beurre de karit\u00e9',shop:'Margueritte Cosm\u00e9tique',price:'25 000 FC',col:'#26A69A'},
];

// ── Audio ──
let audioCtx=null,masterGain=null,audioDest=null;
function initAudio(rec){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();masterGain.gain.value=0.7;
    masterGain.connect(audioCtx.destination);
    if(rec){audioDest=audioCtx.createMediaStreamDestination();masterGain.connect(audioDest)}
}
function playTone(f,dur,vol=0.08,type='sine'){
    if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxWhoosh(){playTone(300,.18,.05,'sawtooth');setTimeout(()=>playTone(600,.12,.04),50)}
function sfxPop(){playTone(900,.07,.06);playTone(1300,.05,.04)}
function sfxSuccess(){playTone(523,.12,.06);setTimeout(()=>playTone(659,.12,.06),100);setTimeout(()=>playTone(784,.12,.06),200);setTimeout(()=>playTone(1047,.2,.07),300)}
function sfxChime(){playTone(880,.12,.05);setTimeout(()=>playTone(1100,.12,.05),100);setTimeout(()=>playTone(1320,.18,.06),200)}
function sfxDing(){playTone(1200,.15,.06)}
function sfxStar(){playTone(1000+Math.random()*500,.1,.04)}
function sfxAlert(){playTone(440,.3,.07,'triangle');setTimeout(()=>playTone(440,.3,.07,'triangle'),350)}
function sfxTick(){playTone(1500,.04,.04,'square')}

// ── Helpers ──
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeInOut(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*clamp(t,0,1)}
function fadeUp(t,delay,dur){const p=clamp((t-delay)/dur,0,1);return{y:lerp(40,0,easeOut(p)),a:lerp(0,1,easeOut(p))}}
function fadeDown(t,delay,dur){const p=clamp((t-delay)/dur,0,1);return{y:lerp(-30,0,easeOut(p)),a:lerp(0,1,easeOut(p))}}

function coverImg(img,x,y,w,h){
    if(!img||!img.complete||!img.naturalWidth)return;
    const ar=img.naturalWidth/img.naturalHeight,cr=w/h;
    let sw,sh;if(ar>cr){sh=h;sw=sh*ar}else{sw=w;sh=sw/ar}
    ctx.drawImage(img,x+(w-sw)/2,y+(h-sh)/2,sw,sh);
}
function rr(x,y,w,h,r,fill,stroke,lw){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke()}
}
function wrapText(text,x,y,maxW,lh){
    const words=text.split(' ');let line='';
    for(const w of words){const t=line+w+' ';if(ctx.measureText(t).width>maxW&&line!==''){ctx.fillText(line.trim(),x,y);y+=lh;line=w+' '}else{line=t}}
    ctx.fillText(line.trim(),x,y);return y+lh;
}
function star5(cx,cy,ro,ri,fill){
    ctx.beginPath();for(let i=0;i<10;i++){const r=i%2===0?ro:ri;const a=Math.PI*i/5-Math.PI/2;if(!i)ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));else ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a))}
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function drawLogoCircle(x,y,r){
    if(!imgs.logo||!imgs.logo.complete)return;
    ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
    ctx.drawImage(imgs.logo,x-r,y-r,r*2,r*2);ctx.restore();
    ctx.beginPath();ctx.arc(x,y,r+1,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.stroke();
}
function drawHeader(){
    ctx.fillStyle='rgba(46,125,50,0.35)';ctx.fillRect(0,0,W,50);
    drawLogoCircle(28,25,16);
    ctx.fillStyle='#fff';ctx.font='800 18px "Segoe UI",sans-serif';ctx.textAlign='left';
    ctx.fillText('Plannie',50,21);ctx.fillStyle=GOLD;ctx.fillText('Business',50,40);
}
function drawBgImg(img,darkness){
    coverImg(img,0,0,W,H);
    ctx.fillStyle=`rgba(0,0,0,${darkness||0.55})`;ctx.fillRect(0,0,W,H);
}

// ============================================================
//  SCENES
// ============================================================
const scenes=[];
function S(start,end,draw){scenes.push({start,end,draw})}

// ── SCENE 1 (0–6s): Hook — file_01 bg — "Nouveaux articles" ──
S(0,6000,function(t){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    // Zoom bg1
    const z=1+easeInOut(clamp(t/6000,0,1))*0.06;
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
    drawBgImg(imgs.bg1,0.5);
    ctx.restore();

    drawHeader();

    // "NOUVEAUX ARTICLES" title
    if(t>600){
        const ft=fadeUp(t,600,1000);
        ctx.globalAlpha=ft.a;
        ctx.textAlign='center';

        // Badge
        const bw=220,bh=36,bx=W/2-bw/2,by=180+ft.y;
        rr(bx,by,bw,bh,18,GOLD);
        ctx.fillStyle='#222';ctx.font='900 16px "Segoe UI",sans-serif';
        ctx.fillText('NOUVEAUX ARTICLES',W/2,by+24);
        ctx.globalAlpha=1;
    }

    // Subtitle
    if(t>1800){
        const ft=fadeUp(t,1800,800);
        ctx.globalAlpha=ft.a;
        ctx.fillStyle='#fff';ctx.font='600 20px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('D\u00e9couvrez ce qui vous',W/2,260+ft.y);
        ctx.fillText('attend aujourd\u2019hui !',W/2,286+ft.y);
        ctx.globalAlpha=1;
    }

    // Arrow bouncing
    if(t>3000){
        const bounce=Math.sin(t/300)*8;
        ctx.fillStyle=G400;ctx.font='400 28px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('\u25BC',W/2,340+bounce);
    }

    // Tease article thumbnails at bottom
    if(t>3500){
        articles.forEach((art,i)=>{
            const d=3500+i*300;
            const ft=fadeUp(t,d,600);
            if(ft.a<=0)return;
            ctx.globalAlpha=ft.a*0.7;
            const sz=65,gap=8,totalW=articles.length*(sz+gap)-gap;
            const ax=W/2-totalW/2+i*(sz+gap);
            const ay=420+ft.y;
            ctx.save();ctx.beginPath();rr(ax,ay,sz,sz,10,null);ctx.clip();
            coverImg(imgs[art.key],ax,ay,sz,sz);
            ctx.restore();
            // Border
            ctx.beginPath();rr(ax,ay,sz,sz,10,null,art.col,2);
            ctx.globalAlpha=1;
        });
    }

    if(t>200&&t<400)sfxWhoosh();
    if(t>1800&&t<2000)sfxDing();
});

// ── SCENE 2 (6–18s): Articles showcase — 2 pages ──
S(6000,18000,function(t){
    ctx.fillStyle=DARK_BG;ctx.fillRect(0,0,W,H);
    drawHeader();

    // Title
    ctx.textAlign='center';ctx.fillStyle=GOLD;ctx.font='800 16px "Segoe UI",sans-serif';
    ctx.fillText('ARTICLES DU MOMENT',W/2,72);
    ctx.fillStyle='rgba(200,220,200,.5)';ctx.font='400 11px "Segoe UI",sans-serif';
    ctx.fillText('Disponibles maintenant sur ' + SITE,W/2,90);

    // 2 articles per "page"
    const page=t<6000?0:1;
    const pageT=t<6000?t:t-6000;
    const startIdx=page*2;

    for(let i=0;i<2;i++){
        const idx=startIdx+i;
        if(idx>=articles.length)break;
        const art=articles[idx];
        const delay=400+i*1200;
        const ft=fadeUp(pageT,delay,800);
        if(ft.a<=0)continue;
        ctx.globalAlpha=ft.a;

        const cardY=110+i*250+ft.y;
        const imgH=170;

        // Article image
        ctx.save();
        ctx.beginPath();rr(25,cardY,W-50,imgH,14,null);ctx.clip();
        coverImg(imgs[art.key],25,cardY,W-50,imgH);
        ctx.restore();

        // Gradient overlay at bottom of image
        const grd=ctx.createLinearGradient(0,cardY+imgH-60,0,cardY+imgH);
        grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(0,0,0,0.8)');
        ctx.fillStyle=grd;
        ctx.beginPath();rr(25,cardY,W-50,imgH,14,null);ctx.clip?.call?undefined:0;
        ctx.fillRect(25,cardY+imgH-60,W-50,60);

        // Border
        ctx.beginPath();rr(25,cardY,W-50,imgH,14,null,art.col+'88',2);

        // Price badge
        const pw=ctx.measureText(art.price).width;
        rr(W-50-pw-30,cardY+8,pw+22,28,14,art.col);
        ctx.fillStyle='#fff';ctx.font='800 14px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText(art.price,W-50-pw/2-19,cardY+27);

        // Name + shop at bottom of image
        ctx.textAlign='left';
        ctx.fillStyle='#fff';ctx.font='700 16px "Segoe UI",sans-serif';
        ctx.fillText(art.name,38,cardY+imgH-30);
        ctx.fillStyle=G300;ctx.font='400 12px "Segoe UI",sans-serif';
        ctx.fillText('chez '+art.shop,38,cardY+imgH-14);

        // "Acheter" button
        const btnY=cardY+imgH+8;
        rr(25,btnY,W-50,34,17,G800);
        ctx.fillStyle='#fff';ctx.font='700 13px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Acheter \u2192',W/2,btnY+22);

        ctx.globalAlpha=1;
    }

    // Page dots
    ctx.textAlign='center';
    for(let p=0;p<2;p++){
        ctx.beginPath();ctx.arc(W/2-8+p*16,H-30,4,0,Math.PI*2);
        ctx.fillStyle=p===page?G400:'rgba(255,255,255,.25)';ctx.fill();
    }

    if(t>200&&t<400)sfxPop();
    if(t>1600&&t<1800)sfxPop();
    if(t>6200&&t<6400)sfxWhoosh();
    if(t>7600&&t<7800)sfxPop();
});

// ── SCENE 3 (18–30s): Message — "Vous ne savez jamais..." ──
S(18000,30000,function(t){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    // bg2 with dark overlay
    const z=1+Math.sin(t/8000)*0.03;
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
    drawBgImg(imgs.bg2,0.65);
    ctx.restore();
    drawHeader();

    // Alert icon
    if(t>400){
        const ft=fadeDown(t,400,800);
        ctx.globalAlpha=ft.a;
        const pulse=1+Math.sin(t/250)*0.05;
        ctx.save();ctx.translate(W/2,100);ctx.scale(pulse,pulse);
        // Warning triangle
        ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(22,16);ctx.lineTo(-22,16);ctx.closePath();
        ctx.fillStyle=ORANGE;ctx.fill();
        ctx.fillStyle='#fff';ctx.font='900 20px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('!',0,12);
        ctx.restore();
        ctx.globalAlpha=1;
    }

    // Main message line 1
    if(t>1200){
        const ft=fadeUp(t,1200,1000);
        ctx.globalAlpha=ft.a;
        ctx.fillStyle='#fff';ctx.font='700 17px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Vous ne savez jamais',W/2,155+ft.y);
        ctx.fillStyle=GOLD;ctx.font='800 19px "Segoe UI",sans-serif';
        ctx.fillText('quand un acheteur',W/2,180+ft.y);
        ctx.fillText('visitera le site.',W/2,204+ft.y);
        ctx.globalAlpha=1;
    }

    // "Votre article tend à expirer..."
    if(t>3500){
        const ft=fadeUp(t,3500,900);
        ctx.globalAlpha=ft.a;
        // Dark card
        rr(20,240+ft.y,W-40,90,12,'rgba(0,0,0,0.6)','rgba(239,108,0,.5)',1.5);
        ctx.fillStyle='#fff';ctx.font='400 13px "Segoe UI",sans-serif';ctx.textAlign='left';
        wrapText('Pourtant, votre article tend \u00e0 expirer de la file des Story de Plannie Business...',35,262+ft.y,W-75,18);
        // Hourglass icon
        ctx.fillStyle=ORANGE;ctx.font='400 28px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('\u23F3',W-42,280+ft.y);
        ctx.globalAlpha=1;
    }

    // "Des concurrents viennent..."
    if(t>6000){
        const ft=fadeUp(t,6000,900);
        ctx.globalAlpha=ft.a;
        rr(20,350+ft.y,W-40,110,12,'rgba(0,0,0,0.6)','rgba(211,47,47,.5)',1.5);
        ctx.fillStyle=RED;ctx.font='700 14px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText('Des concurrents publient aussi !',35,372+ft.y);
        ctx.fillStyle='rgba(220,220,220,.9)';ctx.font='400 12.5px "Segoe UI",sans-serif';
        wrapText('Le site fonctionne comme une vitrine. D\u2019autres articles similaires aux v\u00f4tres apparaissent chaque jour !',35,394+ft.y,W-75,17);
        ctx.globalAlpha=1;
    }

    // Bottom encouragement
    if(t>9000){
        const ft=fadeUp(t,9000,800);
        ctx.globalAlpha=ft.a;
        ctx.fillStyle=G400;ctx.font='600 14px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Alors, que faire ?',W/2,500+ft.y);
        ctx.fillStyle='#fff';ctx.font='400 22px "Segoe UI",sans-serif';
        ctx.fillText('\u25BC',W/2,530+ft.y);
        ctx.globalAlpha=1;
    }

    if(t>200&&t<400)sfxAlert();
    if(t>3500&&t<3700)sfxTick();
    if(t>6000&&t<6200)sfxPop();
});

// ── SCENE 4 (30–42s): Strategy — Revenez, inspirez-vous ──
S(30000,42000,function(t){
    ctx.fillStyle=DARK_BG;ctx.fillRect(0,0,W,H);

    // Subtle bg2 at top
    const topH=140;
    ctx.save();ctx.globalAlpha=0.25;ctx.beginPath();ctx.rect(0,0,W,topH);ctx.clip();
    coverImg(imgs.bg2,0,-30,W,topH+30);ctx.restore();
    const g1=ctx.createLinearGradient(0,topH-60,0,topH);
    g1.addColorStop(0,'rgba(13,31,18,0)');g1.addColorStop(1,DARK_BG);
    ctx.fillStyle=g1;ctx.fillRect(0,topH-60,W,60);

    drawHeader();

    // Title
    if(t>200){
        const ft=fadeUp(t,200,800);
        ctx.globalAlpha=ft.a;
        rr(W/2-130,60+ft.y,260,32,16,G800,G400,1.5);
        ctx.fillStyle='#fff';ctx.font='800 15px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('MAXIMISEZ VOS VENTES !',W/2,81+ft.y);
        ctx.globalAlpha=1;
    }

    // Steps
    const steps=[
        {n:'1',title:'Revenez r\u00e9guli\u00e8rement',desc:'Regardez ce qui est d\u00e9j\u00e0 publi\u00e9 sur la vitrine.',col:G400,icon:'\u{1F440}'},
        {n:'2',title:'Inspirez-vous',desc:'Observez vos concurrents et am\u00e9liorez votre strat\u00e9gie !',col:GOLD,icon:'\u{1F4A1}'},
        {n:'3',title:'Republiez avec style',desc:'Am\u00e9liorez votre article, ajoutez plus de d\u00e9tails.',col:'#42A5F5',icon:'\u{1F4DD}'},
        {n:'4',title:'Faites-le briller',desc:'Placez un commentaire et faites briller votre article avec des \u00e9toiles !',col:'#AB47BC',icon:'\u2B50'},
    ];

    const sY=110;const sH=100;const sG=12;
    steps.forEach((s,i)=>{
        const delay=800+i*1200;
        const ft=fadeUp(t,delay,800);
        if(ft.a<=0)return;
        ctx.globalAlpha=ft.a;

        const y=sY+i*(sH+sG)+ft.y;

        // Card
        rr(20,y,W-40,sH,12,'rgba(22,42,28,.95)','rgba(50,75,55,.6)',1);
        // Left accent
        rr(20,y+sH*.15,4,sH*.7,2,s.col);

        // Number circle
        ctx.beginPath();ctx.arc(48,y+sH/2,16,0,Math.PI*2);ctx.fillStyle=s.col;ctx.fill();
        ctx.fillStyle='#fff';ctx.font='900 16px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText(s.n,48,y+sH/2+6);

        // Title
        ctx.fillStyle='#fff';ctx.font='700 15px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText(s.title,74,y+32);
        // Desc
        ctx.fillStyle='rgba(180,210,185,.85)';ctx.font='400 12px "Segoe UI",sans-serif';
        wrapText(s.desc,74,y+52,W-115,16);

        ctx.globalAlpha=1;
    });

    // Stars animation at bottom
    if(t>6500){
        const stY=sY+4*(sH+sG)+15;
        for(let i=0;i<5;i++){
            const sd=6500+i*200;
            const sa=clamp((t-sd)/400,0,1);
            if(sa<=0)continue;
            ctx.globalAlpha=sa;
            const sc=lerp(0.3,1,easeOut(sa));
            ctx.save();ctx.translate(W/2-36+i*18,stY);ctx.scale(sc,sc);
            star5(0,0,9,4,GOLD);ctx.restore();
            ctx.globalAlpha=1;
            if(t>sd&&t<sd+100)sfxStar();
        }
    }

    if(t>200&&t<400)sfxWhoosh();
    if(t>2000&&t<2200)sfxPop();
    if(t>3200&&t<3400)sfxPop();
    if(t>4400&&t<4600)sfxPop();
    if(t>5600&&t<5800)sfxPop();
});

// ── SCENE 5 (42–52s): "5 jours!" + republier cycle ──
S(42000,52000,function(t){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    // bg1 subtle
    ctx.save();ctx.globalAlpha=0.2;coverImg(imgs.bg1,0,0,W,H);ctx.restore();
    ctx.fillStyle='rgba(13,31,18,0.75)';ctx.fillRect(0,0,W,H);
    drawHeader();

    // Big "5 JOURS" number
    if(t>400){

            ctx.strokeStyle=G300;ctx.lineWidth=2;
            ctx.setLineDash([4,4]);

            ctx.moveTo(297,cy+52);

// ── SCENE 6 (52–62s): Recommandez le site ──
S(52000,62000,function(t){

    // bg2 background
    const z=1+Math.sin(t/5000)*0.03;
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
    drawBgImg(imgs.bg2,0.6);
    ctx.restore();
    drawHeader();

    // Title
    if(t>400){
        const ft=fadeUp(t,400,900);
        ctx.globalAlpha=ft.a;
        ctx.textAlign='center';
        ctx.fillStyle=GOLD;ctx.font='900 22px "Segoe UI",sans-serif';
        ctx.fillText('RECOMMANDEZ',W/2,110+ft.y);
        ctx.fillStyle='#fff';ctx.font='800 22px "Segoe UI",sans-serif';
        ctx.fillText('le site \u00e0 vos proches !',W/2,140+ft.y);
        ctx.globalAlpha=1;
    }

    // Network visualization
    if(t>2000){
        const ft=fadeUp(t,2000,1000);
        ctx.globalAlpha=ft.a;
        // Central person
        const cx=W/2,cy=250+ft.y;
        ctx.beginPath();ctx.arc(cx,cy,20,0,Math.PI*2);ctx.fillStyle=G500;ctx.fill();
        ctx.fillStyle='#fff';ctx.font='700 14px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Vous',cx,cy+5);

        // Connected people
        const people=[
            {x:cx-80,y:cy-50,label:'Ami',col:'#42A5F5'},
            {x:cx+80,y:cy-50,label:'Famille',col:'#AB47BC'},
            {x:cx-90,y:cy+50,label:'Voisin',col:'#FF7043'},
            {x:cx+90,y:cy+50,label:'Coll\u00e8gue',col:GOLD},
        ];

        people.forEach((p,i)=>{
            const pd=2500+i*500;
            const pa=clamp((t-pd)/600,0,1);
            if(pa<=0)return;
            ctx.globalAlpha=ft.a*pa;
            // Line
            ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
            ctx.setLineDash([3,3]);
            ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p.x,p.y);ctx.stroke();
            ctx.setLineDash([]);
            // Circle
            ctx.beginPath();ctx.arc(p.x,p.y,15,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();
            ctx.fillStyle='#fff';ctx.font='600 9px "Segoe UI",sans-serif';
            ctx.fillText(p.label,p.x,p.y+3);

            // Further connections (spread)
            if(t>pd+800){
                const sa=clamp((t-pd-800)/500,0,1);
                ctx.globalAlpha=ft.a*sa*0.5;
                const angle=Math.atan2(p.y-cy,p.x-cx);
                const fx=p.x+Math.cos(angle)*35;
                const fy=p.y+Math.sin(angle)*35;
                ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;
                ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(fx,fy);ctx.stroke();ctx.setLineDash([]);
                ctx.beginPath();ctx.arc(fx,fy,8,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill();
                // Another
                const fx2=p.x+Math.cos(angle+0.8)*40;
                const fy2=p.y+Math.sin(angle+0.8)*40;
                ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(fx2,fy2);ctx.stroke();
                ctx.beginPath();ctx.arc(fx2,fy2,8,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill();
            }
        });
        ctx.globalAlpha=1;
    }

    // Message
    if(t>5500){
        const ft=fadeUp(t,5500,900);
        ctx.globalAlpha=ft.a;
        rr(20,370+ft.y,W-40,100,12,'rgba(0,0,0,.55)','rgba(76,175,80,.4)',1.5);
        ctx.fillStyle='#fff';ctx.font='400 13px "Segoe UI",sans-serif';ctx.textAlign='left';
        wrapText('M\u00eame s\u2019ils n\u2019ach\u00e8tent pas eux-m\u00eames, ils feront circuler la nouvelle jusqu\u2019aux oreilles des potentiels clients !',35,392+ft.y,W-75,18);
        ctx.globalAlpha=1;
    }

    // CTA
    if(t>7500){
        const ft=fadeUp(t,7500,600);
        ctx.globalAlpha=ft.a;
        const pulse=1+Math.sin(t/300)*0.015;
        ctx.save();ctx.translate(W/2,510+ft.y);ctx.scale(pulse,pulse);ctx.translate(-W/2,-510-ft.y);
        rr(40,498+ft.y,W-80,44,22,G500);
        ctx.fillStyle='#fff';ctx.font='800 15px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Partager le site maintenant',W/2,525+ft.y);
        ctx.restore();
        ctx.globalAlpha=1;
    }

    if(t>200&&t<400)sfxWhoosh();
    if(t>2500&&t<2700)sfxPop();
    if(t>5500&&t<5700)sfxChime();
});

        // Phone
        if(t>4500){

            // WA circle
            ctx.beginPath();ctx.arc(W/2-70,phY,8,0,Math.PI*2);ctx.fillStyle=WA_GREEN;ctx.fill();
            rr(W/2-70-4,phY-5,8,10,3,'#fff');
            ctx.fillStyle=GOLD;ctx.font='700 15px "Segoe UI",sans-serif';ctx.textAlign='left';
            ctx.fillText(PHONE,W/2-55,phY+5);

    if(t>200&&t<400)sfxWhoosh();

    if(t>4500&&t<4700)sfxChime();
});

// ============================================================
// RENDER ENGINE (same pattern as pub9)
// ============================================================
function renderFrame(timeMs){
    for(const s of scenes){
        if(timeMs>=s.start&&timeMs<s.end){
            try{s.draw(timeMs-s.start)}catch(e){console.warn('Draw error:',e)}
            return;
        }
    }
}

let isRunning=false;
function runAd(download){
    if(isRunning)return;
    if(imgsLoaded<imgsTotal){document.getElementById('status').textContent='Chargement des images...';setTimeout(()=>runAd(download),500);return}
    isRunning=true;
    const btnP=document.getElementById('btnPlay'),btnD=document.getElementById('btnDl'),st=document.getElementById('status');
    btnP.disabled=true;btnD.disabled=true;

    initAudio(download);
    let recorder,chunks=[];

    if(download){
        st.textContent='Enregistrement en cours... ~1 min 12 sec';
        const vs=cv.captureStream(FPS);
        if(audioDest)audioDest.stream.getAudioTracks().forEach(t=>vs.addTrack(t));
        const mt=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';
        recorder=new MediaRecorder(vs,{mimeType:mt,videoBitsPerSecond:3000000});
        recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
        recorder.onstop=()=>{
            const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);
            const a=document.createElement('a');a.href=url;a.download='Plannie_Business_Pub13_Revenez.webm';
            document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
            st.textContent='Video telechargee !';
        };recorder.start();
    }else{st.textContent='Lecture en cours...'}

    let startTime=null;
    function loop(ts){
        if(!startTime)startTime=ts;
        const elapsed=ts-startTime;
        renderFrame(Math.min(elapsed,DURATION-1));
        if(elapsed<DURATION+500){requestAnimationFrame(loop)}
        else{if(recorder&&recorder.state==='recording')recorder.stop();isRunning=false;btnP.disabled=false;btnD.disabled=false;if(!download)st.textContent='Lecture terminee'}
    }
    requestAnimationFrame(loop);
}
