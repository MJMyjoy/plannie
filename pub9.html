<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plannie Business – Visible sur Google !</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;gap:16px}
canvas{border-radius:16px;box-shadow:0 0 60px rgba(76,175,80,.25);max-width:95vw;max-height:80vh}
@media(max-width:400px){canvas{border-radius:0}}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 28px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:8px}
.btn-play{background:#2E7D32;color:#fff}.btn-play:hover{background:#388E3C}
.btn-dl{background:#fff;color:#2E7D32}.btn-dl:hover{background:#E8F5E9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{color:rgba(255,255,255,.5);font-size:13px;min-height:18px}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<div class="controls">
    <button class="btn btn-play" id="btnPlay" onclick="runAd(false)">▶ Lancer la pub</button>
    <button class="btn btn-dl" id="btnDl" onclick="runAd(true)">📥 Télécharger la vidéo</button>
</div>
<div class="status" id="status"></div>

<script>
const W=360,H=640,FPS=30,DURATION=68000;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

const G900='#1B5E20',G800='#2E7D32',G500='#4CAF50',G400='#66BB6A',G300='#81C784',G200='#A5D6A7';
const GOLD='#F9A825',ORANGE='#EF6C00',BLUE='#1565C0',RED='#D32F2F';
const GBLUE='#4285F4',GRED='#EA4335',GYELLOW='#FBBC05',GGREEN='#34A853';
const SITE='plannie-business.onrender.com';
const PHONE='+243 979 508 196';

const imgFiles={
    logo:'img/plannie_logo_1792797585289.jpg',
    cover:'img/plannie_cover_1792799845450.jpg',
    happy:'img/plannie_happy_result_1792799871450.jpg',
    veste:'exp/veste_95_dollards_chez_tshoku_business.jpg',
    chapatte:'exp/chapatte_500_chez_colodouce.jpg',
    riz:'exp/Riz+Sauce+Viande_4000_chez_Bondo_Food.jpg',
    gauffres:'exp/gauffres_3pcs_a_1000_chez_colodouce.jpg',
    tissage:'exp/tissage_et_closur_40000FC_chez_chriska_business.jpg',
};
const imgs={};let imgsLoaded=0,imgsTotal=Object.keys(imgFiles).length;
Object.entries(imgFiles).forEach(([k,src])=>{const im=new Image();im.onload=()=>{imgsLoaded++};im.onerror=()=>{imgsLoaded++};im.src=src;imgs[k]=im});

// Helpers
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeInOut(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function fadeUp(t,d,dur=500){const p=clamp((t-d)/dur,0,1);return{a:easeOut(p),y:25*(1-easeOut(p))}}
function fadeIn(t,d,dur=500){return{a:easeOut(clamp((t-d)/dur,0,1))}}
function slideL(t,d,dur=500){const p=clamp((t-d)/dur,0,1);return{a:easeOut(p),x:-40*(1-easeOut(p))}}
function popScale(t,d,dur=400){const p=clamp((t-d)/dur,0,1);const s=p<.7?p/.7*1.15:1.15-(p-.7)/.3*.15;return{a:Math.min(p*2,1),s}}

function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill()}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1}
}
function drawBadge(x,y,text,bg,fg='#fff'){
    ctx.font='700 11px "Segoe UI",sans-serif';const tw=ctx.measureText(text).width;
    roundRect(x-tw/2-12,y-11,tw+24,24,12,bg);ctx.fillStyle=fg;ctx.textAlign='center';ctx.fillText(text,x,y+4);
}
function drawParticles(t,n=15,c=G400){
    for(let i=0;i<n;i++){const px=(Math.sin(t/800+i*2.1)*0.4+0.5)*W;const py=(Math.cos(t/600+i*1.7)*0.4+0.5)*H;
    const sz=2+Math.sin(t/400+i)*2;ctx.globalAlpha=0.15+Math.sin(t/500+i)*0.1;ctx.beginPath();ctx.arc(px,py,sz,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}ctx.globalAlpha=1;
}
function drawImgCover(img,x,y,w,h,a,zoom=1){
    if(!img||!img.complete||!img.naturalWidth)return;ctx.save();ctx.globalAlpha=a;
    ctx.beginPath();roundRect(x,y,w,h,0);ctx.clip();
    const iAR=img.naturalWidth/img.naturalHeight,cAR=w/h;let sw,sh;
    if(iAR>cAR){sh=h*zoom;sw=sh*iAR}else{sw=w*zoom;sh=sw/iAR}
    ctx.drawImage(img,x+(w-sw)/2,y+(h-sh)/2,sw,sh);ctx.restore();
}
function wrapText(text,x,y,maxW,lineH){
    const words=text.split(' ');let line='';
    for(const w of words){const test=line+w+' ';if(ctx.measureText(test).width>maxW&&line!==''){ctx.fillText(line.trim(),x,y);y+=lineH;line=w+' '}else{line=test}}
    ctx.fillText(line.trim(),x,y);return y+lineH;
}
function drawProgress(t){
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(0,H-4,W,4);
    const grd=ctx.createLinearGradient(0,0,W*(t/DURATION),0);grd.addColorStop(0,G400);grd.addColorStop(1,'#fff');
    ctx.fillStyle=grd;ctx.fillRect(0,H-4,W*(t/DURATION),4);
}

// Draw Google "G" logo
function drawGoogleG(cx,cy,size,rotation=0){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);
    const r=size/2;
    // Blue arc (right+top)
    ctx.beginPath();ctx.arc(0,0,r,-0.3,1.2);ctx.strokeStyle=GBLUE;ctx.lineWidth=size*0.18;ctx.lineCap='round';ctx.stroke();
    // Red arc (top-left)
    ctx.beginPath();ctx.arc(0,0,r,1.2,2.3);ctx.strokeStyle=GRED;ctx.stroke();
    // Yellow arc (bottom-left)
    ctx.beginPath();ctx.arc(0,0,r,2.3,3.5);ctx.strokeStyle=GYELLOW;ctx.stroke();
    // Green arc (bottom-right)
    ctx.beginPath();ctx.arc(0,0,r,3.5,5.9);ctx.strokeStyle=GGREEN;ctx.stroke();
    // Blue horizontal bar
    ctx.lineWidth=1;ctx.fillStyle=GBLUE;ctx.fillRect(-2,-size*0.09,r+2,size*0.18);
    ctx.restore();
}

// Draw Google colored text
function drawGoogleText(x,y,size){
    ctx.font=`700 ${size}px "Segoe UI",sans-serif`;ctx.textAlign='left';
    const letters=[{c:'G',f:GBLUE},{c:'o',f:GRED},{c:'o',f:GYELLOW},{c:'g',f:GBLUE},{c:'l',f:GGREEN},{c:'e',f:GRED}];
    let cx=x;
    letters.forEach(l=>{ctx.fillStyle=l.f;ctx.fillText(l.c,cx,y);cx+=ctx.measureText(l.c).width});
}

// Typing animation
function typeText(text,t,charDelay=80){
    const chars=Math.min(text.length,Math.floor(t/charDelay));
    return text.substring(0,chars);
}

// ============================================================
// SCENES
// ============================================================

// S1: HOOK — Breaking news style (0-5500)
function drawS1(t){
    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);

    // Dramatic flash
    if(t<300){ctx.fillStyle=`rgba(255,255,255,${0.6*(1-t/300)})`;ctx.fillRect(0,0,W,H)}

    // Breaking badge
    const fb=popScale(t,200,600);
    if(fb.a>0){
        ctx.save();ctx.globalAlpha=fb.a;
        ctx.translate(W/2,55);ctx.scale(fb.s,fb.s);ctx.translate(-W/2,-55);
        const blink=t>1500?1:0.5+0.5*Math.sin(t/100);
        roundRect(W/2-95,38,190,34,17,RED);
        ctx.globalAlpha=fb.a*blink;
        ctx.fillStyle='#fff';ctx.font='800 16px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('⚡ GRANDE NOUVELLE ⚡',W/2,62);
        ctx.restore();
    }

    // Google G animation — spinning then settling
    const fg=fadeIn(t,800,800);
    if(fg.a>0){
        ctx.globalAlpha=fg.a;
        const rot=t<2500?(t-800)*0.008:0;
        const gSize=t<2500?40+easeOut(clamp((t-800)/1700,0,1))*30:70;
        drawGoogleG(W/2,175,gSize,rot);
    }

    // Main announcement
    const f1=fadeUp(t,2000,700);
    ctx.globalAlpha=f1.a;ctx.fillStyle='#fff';
    ctx.font='800 24px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Plannie Business',W/2,H*0.42+f1.y);
    ctx.fillText('est maintenant',W/2,H*0.42+34+f1.y);

    const f2=fadeUp(t,2800,700);
    ctx.globalAlpha=f2.a;ctx.fillStyle=GBLUE;
    ctx.font='800 26px "Segoe UI",sans-serif';
    ctx.fillText('VISIBLE SUR',W/2,H*0.58+f2.y);

    const fgo=fadeUp(t,3400,600);
    if(fgo.a>0){
        ctx.globalAlpha=fgo.a;
        // Google text centered
        ctx.font='800 38px "Segoe UI",sans-serif';
        const gw=ctx.measureText('Google').width;
        drawGoogleText(W/2-gw/2,H*0.58+48+fgo.y,38);
    }

    // Exclamation
    const fe=fadeUp(t,4200,400);
    ctx.globalAlpha=fe.a;ctx.fillStyle='#fff';
    ctx.font='800 30px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('! 🎉',W/2+80,H*0.58+48+fe.y);

    // Pulsing arrow
    if(t>4800){
        ctx.globalAlpha=0.3+0.7*Math.abs(Math.sin(t/300));
        ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('↓',W/2,H-25);
    }
    ctx.globalAlpha=1;
}

// S2: GOOGLE SEARCH SIMULATION (5500-14000)
function drawS2(t){
    // White Google-like background
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);

    // Google logo at top
    const fl=fadeIn(t,100,400);
    ctx.globalAlpha=fl.a;
    drawGoogleText(W/2-55,42,28);
    ctx.globalAlpha=1;

    // Search bar
    const fsb=fadeUp(t,300,400);
    if(fsb.a>0){
        ctx.globalAlpha=fsb.a;
        roundRect(20,58+fsb.y,W-40,40,20,null,'#dfe1e5');
        // Search icon
        ctx.beginPath();ctx.arc(38,78+fsb.y,7,0,Math.PI*2);
        ctx.strokeStyle='#9aa0a6';ctx.lineWidth=2;ctx.stroke();
        ctx.beginPath();ctx.moveTo(43,83+fsb.y);ctx.lineTo(48,88+fsb.y);ctx.stroke();ctx.lineWidth=1;

        // Typing animation
        const typed=typeText('Plannie Business',Math.max(0,t-800),100);
        ctx.fillStyle='#222';ctx.font='400 15px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText(typed,52,82+fsb.y);
        // Blinking cursor
        if(t<2500&&Math.floor(t/500)%2===0){
            const tw=ctx.measureText(typed).width;
            ctx.fillStyle='#222';ctx.fillRect(52+tw+2,68+fsb.y,2,20);
        }
    }

    // Separator line (after typing done)
    if(t>2600){
        const fline=fadeIn(t,2600,200);
        ctx.globalAlpha=fline.a*0.3;
        ctx.fillStyle='#dfe1e5';ctx.fillRect(0,105,W,1);
        ctx.globalAlpha=1;
    }

    // Search result #1 — Plannie Business (our site!)
    if(t>3000){
        const fr=fadeUp(t,3000,600);
        ctx.globalAlpha=fr.a;
        const ry=118+fr.y;

        // Favicon + URL line
        // Draw small Plannie leaf icon
        ctx.fillStyle=G800;ctx.font='12px sans-serif';ctx.textAlign='left';
        ctx.fillText('🌿',22,ry+13);
        ctx.fillStyle='#202124';ctx.font='400 12px "Segoe UI",sans-serif';
        ctx.fillText('plannie-business.onrender.com',40,ry+13);
        ctx.fillStyle='#70757a';ctx.font='400 11px "Segoe UI",sans-serif';
        ctx.fillText('https://plannie-business.onrender.com',40,ry+28);

        // Title (blue link)
        ctx.fillStyle='#1a0dab';ctx.font='700 17px "Segoe UI",sans-serif';
        ctx.fillText('Plannie Business – Marché en',22,ry+52);
        ctx.fillText('ligne local',22,ry+72);

        // Description (black text with product names)
        ctx.fillStyle='#4d5156';ctx.font='400 12px "Segoe UI",sans-serif';
        const desc='Découvrez des articles locaux : Veste élégante 95$, Chapatte 500 FC, Riz+Sauce+Viande 4000 FC, Tissage & Closure...';
        wrapText(desc,22,ry+92,W-44,17);

        // Highlight glow around the result
        if(t>3800&&t<5500){
            const pulse=0.1+0.08*Math.sin(t/200);
            ctx.strokeStyle=`rgba(66,133,244,${pulse})`;
            ctx.lineWidth=3;
            roundRect(14,ry-8,W-28,150,12,null,`rgba(66,133,244,${pulse+0.1})`);
            ctx.lineWidth=1;
        }

        // "Voilà notre site !" annotation
        if(t>4200){
            const fa=fadeUp(t,4200,400);
            ctx.globalAlpha=fa.a;
            // Arrow pointing to result
            ctx.strokeStyle=G800;ctx.lineWidth=2;
            ctx.beginPath();ctx.moveTo(W-40,ry+65);ctx.lineTo(W-20,ry+45);ctx.stroke();
            ctx.beginPath();ctx.moveTo(W-20,ry+45);ctx.lineTo(W-25,ry+55);ctx.stroke();
            ctx.beginPath();ctx.moveTo(W-20,ry+45);ctx.lineTo(W-30,ry+47);ctx.stroke();
            ctx.lineWidth=1;
            // Label
            roundRect(W-110,ry+68,100,28,8,G800);
            ctx.fillStyle='#fff';ctx.font='700 11px "Segoe UI",sans-serif';ctx.textAlign='center';
            ctx.fillText('Notre site ! ✅',W-60,ry+86);
        }
    }

    // Search result #2 (faded, generic)
    if(t>5000){
        const fr2=fadeUp(t,5000,400);
        ctx.globalAlpha=fr2.a*0.35;
        const ry2=280+fr2.y;
        ctx.fillStyle='#70757a';ctx.font='400 11px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText('www.autre-site.com',40,ry2+13);
        ctx.fillStyle='#1a0dab';ctx.font='700 14px "Segoe UI",sans-serif';
        ctx.fillText('Autre résultat de recherche...',22,ry2+35);
        ctx.fillStyle='#4d5156';ctx.font='400 11px "Segoe UI",sans-serif';
        ctx.fillText('Lorem ipsum dolor sit amet...',22,ry2+55);
    }

    // Bottom message
    if(t>6000){
        const fm=fadeUp(t,6000,500);
        ctx.globalAlpha=fm.a;
        roundRect(15,H-90+fm.y,W-30,70,14,G800);
        ctx.fillStyle='#fff';ctx.font='700 14px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('Plannie Business apparaît',W/2,H-68+fm.y);
        ctx.fillText('dans les résultats Google ! 🎉',W/2,H-48+fm.y);
    }

    ctx.globalAlpha=1;
}

// S3: CONSEQUENCE 1 — Plus besoin du lien (14000-21000)
function drawS3(t){
    const grd=ctx.createLinearGradient(0,0,W,H);
    grd.addColorStop(0,'#0D3B14');grd.addColorStop(1,G900);
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    drawParticles(t,16,G300);

    const ft=fadeUp(t,100,400);
    ctx.globalAlpha=ft.a;ctx.fillStyle='#fff';
    ctx.font='700 18px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Qu\'est-ce que ça change',W/2,42+ft.y);
    ctx.fillText('pour TOI ? 🤔',W/2,66+ft.y);
    ctx.globalAlpha=1;

    // Point 1: Plus besoin de lien
    const f1=fadeUp(t,800,600);
    if(f1.a>0){
        ctx.globalAlpha=f1.a;
        roundRect(15,100+f1.y,W-30,155,16,'rgba(66,133,244,0.08)','rgba(66,133,244,0.3)');

        // Number
        ctx.beginPath();ctx.arc(45,130+f1.y,18,0,Math.PI*2);ctx.fillStyle=GBLUE;ctx.fill();
        ctx.fillStyle='#fff';ctx.font='800 18px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('1',45,137+f1.y);

        ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='700 15px "Segoe UI",sans-serif';
        ctx.fillText('Plus besoin du lien !',72,128+f1.y);

        ctx.fillStyle=G200;ctx.font='400 12px "Segoe UI",sans-serif';
        wrapText("Tape simplement « Plannie Business » dans Google et tu arrives directement sur le site. Fini la galère de chercher le lien !",30,155+f1.y,W-60,17);

        // Mini search bar illustration
        roundRect(35,215+f1.y,W-70,30,15,null,'rgba(255,255,255,0.2)');
        ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='400 12px "Segoe UI",sans-serif';ctx.textAlign='left';
        ctx.fillText('🔍 Plannie Business',50,235+f1.y);
        ctx.fillStyle=G400;ctx.font='700 10px "Segoe UI",sans-serif';ctx.textAlign='right';
        ctx.fillText('→ Accès direct !',W-50,235+f1.y);
    }

    // Point 2: Tes articles visibles mondialement
    const f2=fadeUp(t,2500,600);
    if(f2.a>0){
        ctx.globalAlpha=f2.a;
        roundRect(15,275+f2.y,W-30,155,16,'rgba(52,168,83,0.08)','rgba(52,168,83,0.3)');

        ctx.beginPath();ctx.arc(45,305+f2.y,18,0,Math.PI*2);ctx.fillStyle=GGREEN;ctx.fill();
        ctx.fillStyle='#fff';ctx.font='800 18px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('2',45,312+f2.y);

        ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='700 15px "Segoe UI",sans-serif';
        ctx.fillText('Tes articles sur Google !',72,303+f2.y);

        ctx.fillStyle=G200;ctx.font='400 12px "Segoe UI",sans-serif';
        wrapText("En publiant ton article sur Plannie Business, il apparaît dans les résultats Google. C'est le MONDE ENTIER qui peut le voir !",30,328+f2.y,W-60,17);

        // Globe animation
        if(t>3200){
            const spin=(t-3200)*0.002;
            ctx.font='28px sans-serif';ctx.textAlign='center';
            ctx.fillText('🌍',W-50,395+f2.y);
        }
    }

    // Point 3: L'IA peut proposer tes articles
    const f3=fadeUp(t,4500,600);
    if(f3.a>0){
        ctx.globalAlpha=f3.a;
        roundRect(15,450+f3.y,W-30,155,16,'rgba(249,168,37,0.08)','rgba(249,168,37,0.3)');

        ctx.beginPath();ctx.arc(45,480+f3.y,18,0,Math.PI*2);ctx.fillStyle=GOLD;ctx.fill();
        ctx.fillStyle='#333';ctx.font='800 18px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('3',45,487+f3.y);

        ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='700 15px "Segoe UI",sans-serif';
        ctx.fillText('L\'IA parle de tes articles !',72,478+f3.y);

        ctx.fillStyle=G200;ctx.font='400 12px "Segoe UI",sans-serif';
        wrapText("Gemini, l'IA de Google, peut proposer tes articles dans ses réponses. Un marketing sans pareil, totalement automatique !",30,503+f3.y,W-60,17);

        // Gemini sparkle
        if(t>5200){
            const blink=0.5+0.5*Math.sin(t/250);
            ctx.globalAlpha=f3.a*blink;
            ctx.font='20px sans-serif';ctx.textAlign='center';
            ctx.fillText('✨',W-45,565+f3.y);
        }
    }
    ctx.globalAlpha=1;
}

// S4: LE BOUTON VERT — Montrer le bouton de soumission (21000-29000)
function drawS4(t){
    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);

    const ft=fadeUp(t,100,400);
    ctx.globalAlpha=ft.a;ctx.fillStyle='#fff';
    ctx.font='700 18px "Segoe UI",sans-serif';ctx.textAlign='center';
    ctx.fillText('Tu connais ce bouton ? 👇',W/2,40+ft.y);
    ctx.globalAlpha=1;

    // Phone mockup showing the site homepage
    const fphone=fadeUp(t,500,600);
    if(fphone.a>0){
        ctx.globalAlpha=fphone.a;
        // Phone frame
        roundRect(25,65+fphone.y,W-50,H-130,24,'rgba(255,255,255,0.03)','rgba(255,255,255,0.12)');

        // Status bar
        roundRect(35,75+fphone.y,W-70,22,8,'rgba(46,125,50,0.4)');
        ctx.fillStyle=G400;ctx.font='600 9px "Segoe UI",sans-serif';ctx.textAlign='center';
        ctx.fillText('plannie-business.onrender.com',W/2,90+fphone.y);

        // Site header (Plannie logo area)
        roundRect(35,102+fphone.y,W-70,55,0,G800);
        // Leaf icon
        ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.textAlign='center';
        ctx.fillText('🌿',W/2,122+fphone.y);
        ctx.fillStyle='#fff';ctx.font='700 14px "Segoe UI",sans-serif';
        ctx.fillText('Plannie Business',W/2,145+fphone.y);

        // Fake article cards in slider
        const sliderY=165+fphone.y;
        roundRect(40,sliderY,120,85,10,'rgba(255,255,255,0.06)');
        if(imgs.veste&&imgs.veste.complete){

// Audio
let actx,masterGain,audioDest;
function initAudio(rec){actx=new(window.AudioContext||window.webkitAudioContext)();masterGain=actx.createGain();masterGain.gain.value=0.8;masterGain.connect(actx.destination);if(rec){audioDest=actx.createMediaStreamDestination();masterGain.connect(audioDest)}}
function playTone(f,dur,type='sine',vol=0.15){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);o.connect(g);g.connect(masterGain);o.start();o.stop(actx.currentTime+dur)}
function sfxWhoosh(){if(!actx)return;const n=actx.sampleRate*0.35,buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)*0.25;const s=actx.createBufferSource();s.buffer=buf;const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=600;bp.Q.value=0.8;bp.frequency.exponentialRampToValueAtTime(2200,actx.currentTime+0.3);s.connect(bp);bp.connect(masterGain);s.start()}
function sfxDing(){playTone(880,.4);setTimeout(()=>playTone(1320,.5,'sine',.1),80);setTimeout(()=>playTone(1760,.5,'sine',.06),160)}
function sfxPop(){playTone(600,.1,'sine',.12);setTimeout(()=>playTone(900,.08,'sine',.08),50)}
function sfxSuccess(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.3,'sine',.1),i*100))}
function sfxRise(){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(200,actx.currentTime);o.frequency.exponentialRampToValueAtTime(800,actx.currentTime+0.6);g.gain.setValueAtTime(0.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.7);o.connect(g);g.connect(masterGain);o.start();o.stop(actx.currentTime+0.7)}
function sfxClick(){playTone(1200,.05,'square',.06)}
function sfxBeat(){playTone(70,.08,'sine',.03)}
function sfxChime(){playTone(1047,.3,'sine',.08);setTimeout(()=>playTone(1319,.25,'sine',.06),120);setTimeout(()=>playTone(1568,.3,'sine',.05),240);setTimeout(()=>playTone(2093,.4,'sine',.04),360)}
function sfxAlert(){playTone(880,.15,'square',.1);setTimeout(()=>playTone(880,.15,'square',.1),200)}
let bgInt;function startBg(){bgInt=setInterval(()=>sfxBeat(),500)}function stopBg(){clearInterval(bgInt)}

function scheduleSounds(){
    const ev=[
        [0,sfxAlert],[200,sfxRise],[500,sfxDing],[2000,sfxPop],[2800,sfxPop],[3400,sfxChime],[4200,sfxSuccess],
        [5500,sfxWhoosh],[6000,sfxClick],[6500,sfxClick],[7000,sfxClick],[7500,sfxClick],[8000,sfxClick],[8500,sfxPop],[9500,sfxDing],[11000,sfxPop],
        [14000,sfxWhoosh],[14200,sfxDing],[14800,sfxPop],[16500,sfxPop],[18500,sfxPop],
        [21000,sfxWhoosh],[21200,sfxPop],[23000,sfxDing],[24000,sfxPop],[25800,sfxPop],[27000,sfxAlert],[28000,sfxDing],
        [29000,sfxWhoosh],[29200,sfxPop],[31000,sfxClick],[31500,sfxClick],[32000,sfxClick],[33000,sfxPop],[35500,sfxDing],[36800,sfxPop],
        [38000,sfxAlert],[38200,sfxWhoosh],[39000,sfxPop],[40200,sfxPop],[42000,sfxDing],[43500,sfxPop],
        [45000,sfxRise],[45200,sfxChime],[46500,sfxPop],[47000,sfxPop],[47500,sfxPop],[48000,sfxPop],[48500,sfxPop],[49000,sfxPop],[50000,sfxSuccess],[52000,sfxDing],
        [56000,sfxRise],[57000,sfxPop],[58500,sfxDing],[60000,sfxPop],[62000,sfxChime],[64000,sfxSuccess],
    ];
    ev.forEach(([t,fn])=>setTimeout(fn,t));
    setTimeout(stopBg,56000);
}

let isRunning=false;
function runAd(download){
    if(isRunning)return;
    if(imgsLoaded<imgsTotal){document.getElementById('status').textContent='Chargement des images...';setTimeout(()=>runAd(download),500);return}
    isRunning=true;
    const btnP=document.getElementById('btnPlay'),btnD=document.getElementById('btnDl'),st=document.getElementById('status');
    btnP.disabled=true;btnD.disabled=true;
    initAudio(download);let recorder,chunks=[];
    if(download){
        st.textContent='Enregistrement en cours... ~1 min 8 sec';
        const vs=cv.captureStream(FPS);
        if(audioDest)audioDest.stream.getAudioTracks().forEach(t=>vs.addTrack(t));
        const mt=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';
        recorder=new MediaRecorder(vs,{mimeType:mt,videoBitsPerSecond:3000000});
        recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
        recorder.onstop=()=>{
            const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);
            const a=document.createElement('a');a.href=url;a.download='Plannie_Business_SurGoogle.webm';
            document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
            st.textContent='Video telechargee !';
        };recorder.start();
    }else{st.textContent='Lecture en cours...'}
    startBg();scheduleSounds();
    const t0=performance.now();
    function loop(now){
        const elapsed=now-t0;renderFrame(Math.min(elapsed,DURATION));
        if(elapsed<DURATION+500){requestAnimationFrame(loop)}
        else{if(recorder&&recorder.state==='recording')recorder.stop();isRunning=false;btnP.disabled=false;btnD.disabled=false;if(!download)st.textContent='Lecture terminee'}
    }
    requestAnimationFrame(loop);
}
renderFrame(0);
